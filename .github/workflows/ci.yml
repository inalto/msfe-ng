name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Every job runs inside an AlmaLinux container: the shipped Perl (cPanel hooks,
# logging plugin, CGIs), the shell scripts and the daemon are exercised with the
# EL toolchain they are deployed on (EL8 = perl 5.26, glibc 2.28; EL9 = 5.32),
# not Ubuntu's. GitHub has no EL runners, so the Ubuntu host only hosts the
# container. `git` is installed before checkout so actions/checkout clones a
# real repository (its no-git fallback downloads a tarball with no history).
jobs:
  rust:
    strategy:
      matrix:
        el: [8, 9]
    runs-on: ubuntu-latest
    container: almalinux:${{ matrix.el }}
    steps:
      - name: EL build tools
        run: dnf -q -y install git gcc
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: EL git + Node 20
        run: dnf -q -y install git && dnf -q -y module install nodejs:20/common
      - uses: actions/checkout@v4
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build Tailwind CSS
        working-directory: web
        run: npm run build
      - name: Committed CSS is up to date
        # If this fails, run `npm run build` in web/ and commit the result.
        run: git diff --exit-code web/whm/app.css web/user/app.css
      - name: SPA JS syntax
        run: |
          for area in whm user; do
            sed -n '/<script>/,/<\/script>/p' "web/$area/index.html" | sed '1d;$d' > "/tmp/$area.js"
            echo "== node --check $area"; node --check "/tmp/$area.js"
          done

  scripts:
    strategy:
      matrix:
        el: [8, 9]
    runs-on: ubuntu-latest
    container: almalinux:${{ matrix.el }}
    steps:
      - name: EL perl + shellcheck
        # ShellCheck comes from EPEL on both releases.
        run: dnf -q -y install epel-release && dnf -q -y install git perl perl-DBI perl-DBD-SQLite ShellCheck
      - uses: actions/checkout@v4
      - name: shellcheck
        # -S warning: info-level notes (SC2015 with an intentional `|| true`,
        # SC1091 dynamic source) are fine; warnings and errors still fail.
        run: shellcheck -S warning packaging/*.sh packaging/tests/*.sh
      - name: lib.sh contract test
        run: sh packaging/tests/lib.sh
      - name: exim-shim contract test
        run: sh packaging/tests/exim-shim.sh
      - name: engine-install contract test
        run: sh packaging/tests/engine-install.sh
      - name: perl syntax
        run: |
          for f in panel/cpanel/whm/msfe-ng.cgi panel/cpanel/uapi/MSFE_NG.pm \
                   panel/cpanel/jupiter/msfe-ng.live.cgi \
                   panel/hooks/UpcpHook.pm panel/hooks/EximHook.pm panel/mailscanner/MSFENG.pm \
                   panel/directadmin/admin/index.raw panel/directadmin/user/index.raw; do
            echo "== $f"; perl -c "$f" || exit 1
          done
      - name: logging plugin test
        run: perl panel/mailscanner/t/msfeng.t
      - name: cPanel live.cgi contract test
        run: perl panel/cpanel/jupiter/t/live-cgi.t
