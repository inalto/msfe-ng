<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* Palette from the data-viz reference (status colors validated; blue single-series). */
  :root{
    color-scheme: light dark;
    --page:#f9f9f7; --surface:#fcfcfb; --line:#e1e0d9; --ring:rgba(11,11,11,.10);
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --accent:#2a78d6; --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  }
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
    --page:#0d0d0d; --surface:#1a1a19; --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --accent:#3987e5; --grid:#2c2c2a; --axis:#383835;
  }}
  :root[data-theme="dark"]{
    --page:#0d0d0d; --surface:#1a1a19; --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --accent:#3987e5; --grid:#2c2c2a; --axis:#383835;
  }
  *{box-sizing:border-box}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--page);color:var(--ink)}
  header{display:flex;align-items:center;gap:.7rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line);background:var(--surface)}
  .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  header h1{font-size:1.05rem;margin:0}
  header .meta{margin-left:auto;color:var(--muted);font-size:.8rem}
  nav.tabs{display:flex;gap:.25rem;padding:.5rem 1rem 0;border-bottom:1px solid var(--line);background:var(--surface)}
  nav.tabs button{font:inherit;border:0;background:none;color:var(--ink2);padding:.55rem .9rem;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent}
  nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  main{width:100%;margin:0;padding:1.25rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.15rem;margin-bottom:1rem}
  .card h2{font-size:.95rem;margin:0 0 .75rem}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.75rem}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
  .tile .lbl{display:flex;align-items:center;gap:.4rem;color:var(--ink2);font-size:.8rem}
  .tile .dot{width:9px;height:9px;border-radius:50%}
  .tile .val{font-size:1.7rem;font-weight:650;margin-top:.2rem;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:1rem;flex-wrap:wrap}
  .row>.card{flex:1;min-width:18rem}
  .ctl{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem}
  select,input,textarea,button.act{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem}
  button.act{background:var(--accent);color:#fff;border-color:transparent;cursor:pointer;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}
  label.field{display:grid;gap:.25rem;margin-bottom:.7rem;font-size:.82rem;color:var(--ink2)}
  label.field input,label.field select{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1.25rem}
  textarea{width:100%;min-height:14rem;font-family:ui-monospace,monospace;font-size:.82rem;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:.05rem .4rem;border-radius:999px;font-size:.72rem;color:#fff}
  .bars text{fill:var(--ink2)} .bars .axis{stroke:var(--axis)} .bars .grid{stroke:var(--grid)}
  .empty{color:var(--muted);padding:1.5rem 0;text-align:center}
  pre.log{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;font:.76rem/1.45 ui-monospace,monospace;max-height:24rem;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
  button.act.danger{background:var(--critical)}
  button.act.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
  .statline{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
  .statline .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.35rem}
  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:.5rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .muted{color:var(--muted)}
</style></head>
<body>
  <header>
    <span class="logo">MS</span>
    <h1>MSFE-NG · MailScanner Front-End</h1>
    <span class="meta">{{VIEW}} · {{PANEL}} · v{{VERSION}}</span>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="dash" aria-selected="true">Dashboard</button>
    <button data-tab="settings" aria-selected="false">Settings</button>
    <button data-tab="lists" aria-selected="false">Lists</button>
    <button data-tab="messages" aria-selected="false">Messages</button>
    <button data-tab="rules" aria-selected="false">Rules</button>
    <button data-tab="service" aria-selected="false">Service</button>
    <button data-tab="logs" aria-selected="false">Logs</button>
    <button data-tab="queues" aria-selected="false">Queues</button>
    <button data-tab="config" aria-selected="false">Config</button>
  </nav>
  <div id="doctorbar" style="display:none;padding:.5rem 1.25rem;border-bottom:1px solid var(--line);font-size:.85rem"></div>
  <main id="view"></main>
  <div class="toast" id="toast"></div>

<script>
const PANEL="{{PANEL}}";
// Direct = served by the daemon in dev; else proxied through the panel CGI.
const DIRECT = !location.pathname.includes('.cgi') && !location.pathname.includes('CMD_PLUGINS');
async function api(path,{method='GET',body=null,raw=false}={}){
  const opts={method,headers:{}};
  if(body){opts.body=JSON.stringify(body);opts.headers['Content-Type']='application/json';}
  let url=path;
  if(!DIRECT){url=location.pathname.split('?')[0];opts.headers['X-MSFE-Path']=path;}
  const r=await fetch(url,opts);
  if(raw) return r.text();
  try{return await r.json();}catch(e){return {error:'bad response'};}
}
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...c)=>{const n=document.createElement(t);for(const k in a){if(k==='html')n.innerHTML=a[k];else n.setAttribute(k,a[k]);}c.flat().forEach(x=>n.append(x));return n;};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

let policy=null; // {settings:{}, whitelist:[], blacklist:[]}
let days=7;

const tabs={dash:renderDash,settings:renderSettings,lists:renderLists,messages:renderMessages,rules:renderRules,service:renderService,logs:renderLogs,queues:renderQueues,config:renderConfig};
let logTimer=null; // maillog auto-refresh; cleared on every tab switch
let jrnTimer=null; // restart-console journal polling; cleared on every tab switch
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  clearInterval(logTimer);logTimer=null;
  clearInterval(jrnTimer);jrnTimer=null;
  clearInterval(msgTimer);msgTimer=null;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  tabs[b.dataset.tab]();
});

// ---- Dashboard --------------------------------------------------------------
async function renderDash(){
  const v=$('#view');v.innerHTML='';
  const ctl=el('div',{class:'ctl'},el('span',{class:'muted'},'Window: '));
  const sel=el('select');[7,30,90].forEach(d=>sel.append(el('option',{value:d,...(d===days?{selected:'selected'}:{})},d+' days')));
  sel.onchange=()=>{days=+sel.value;renderDash();};
  ctl.append(sel);v.append(ctl);

  const tiles=el('div',{class:'tiles'});v.append(tiles);
  const sum=await api('/api/stats/summary?days='+days);
  if(sum && sum.available){
    const spec=[['total','Total','var(--accent)'],['clean','Clean','var(--good)'],
      ['spam','Spam','var(--warning)'],['highspam','High spam','var(--serious)'],
      ['virus','Virus','var(--critical)'],['quarantined','Quarantined','var(--muted)']];
    spec.forEach(([k,lbl,c])=>tiles.append(el('div',{class:'tile'},
      el('div',{class:'lbl'},el('span',{class:'dot',style:'background:'+c}),lbl),
      el('div',{class:'val'},String(sum[k]??0)))));
  } else {
    tiles.remove();
    await renderSetupCard(v);
  }

  const rowc=el('div',{class:'row'});v.append(rowc);
  const volCard=el('div',{class:'card'},el('h2',{},'Daily volume'));
  const topCard=el('div',{class:'card'},el('h2',{},'Top sender domains'));
  rowc.append(volCard,topCard);

  const ser=await api('/api/stats/series?days='+days);
  if(ser&&ser.available&&ser.points&&ser.points.length)
    volCard.append(barChart(ser.points.map(p=>({label:p.date.slice(5),value:p.total})),'var(--accent)'));
  else volCard.append(el('div',{class:'empty'},'No volume data.'));

  const top=await api('/api/stats/top?field=from_domain&days='+days+'&limit=8');
  if(top&&top.available&&top.items&&top.items.length)
    topCard.append(hbars(top.items.map(i=>({label:i.key,value:i.count}))));
  else topCard.append(el('div',{class:'empty'},'No sender data.'));
}

// First-run setup card: shown on the dashboard until stats flow.
async function renderSetupCard(v){
  const s=await api('/api/setup');
  const card=el('div',{class:'card'},el('h2',{},'Finish setup'),
    el('div',{class:'muted',style:'margin-bottom:.6rem;font-size:.8rem'},
      'Two steps left before the dashboard fills with data. Both are safe to re-run.'));
  const stateLine=(ok,okTxt,noTxt)=>el('div',{class:'statline'},
    el('span',{},el('span',{class:'dot',style:'background:'+(ok?'var(--good)':'var(--warning)')}),ok?okTxt:noTxt));
  const out=el('pre',{class:'log',style:'display:none;max-height:10rem'});
  async function doStep(path,btn,confirmMsg){
    if(confirmMsg&&!confirm(confirmMsg))return;
    btn.disabled=true;
    const r=await api(path,{method:'POST'});
    btn.disabled=false;
    out.style.display='';
    out.textContent+=(out.textContent?'\n':'')+((r&&r.log)?r.log.join('\n'):(r.error||'failed'));
    toast(r&&r.ok?'Done':'Failed — see details');
    renderDash();
  }
  const dbBtn=el('button',{class:'act'},s.db_ready?'Database ready ✓ (re-check)':'1. Create database & apply schema');
  dbBtn.onclick=()=>doStep('/api/setup/db',dbBtn,
    s.db_ready?null:'Create the MySQL database and user?\n\nA database and user (default: msfe_ng) are created with a generated password, saved into MSFE-NG’s config, and the schema is applied. Nothing outside MSFE-NG’s own database is touched.');
  const logBtn=el('button',{class:'act'},s.logging_enabled?'Logging enabled ✓':'2. Enable message logging');
  logBtn.onclick=()=>doStep('/api/setup/logging',logBtn,
    s.logging_enabled?null:'Enable per-message logging?\n\nInstalls the MSFE-NG logging plugin into MailScanner (a one-time backup of MailScanner.conf is kept) and restarts MailScanner so every scanned message is recorded for the dashboard, Messages tab and quarantine.');
  card.append(
    stateLine(s.db_ready,'Database: connected and ready','Database: not set up yet'),
    stateLine(s.logging_enabled,'Message logging: enabled','Message logging: not enabled yet'),
    el('div',{class:'ctl'},dbBtn,logBtn),out,
    el('div',{class:'muted',style:'font-size:.8rem'},'Once both are done and mail flows, tiles and charts appear here (new messages only — history starts now).'));
  v.append(card);
}

// vertical bar chart (single series) as inline SVG
function barChart(data,color){
  const W=Math.max(320,data.length*34),H=180,pad=24,bw=Math.min(26,(W-2*pad)/data.length-6);
  const max=Math.max(1,...data.map(d=>d.value));
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'bars',width:'100%',height:H});
  svg.append(svgEl('line',{class:'axis',x1:pad,y1:H-pad,x2:W-4,y2:H-pad}));
  data.forEach((d,i)=>{
    const x=pad+i*((W-2*pad)/data.length)+3, h=(H-2*pad)*d.value/max, y=H-pad-h;
    const r=svgEl('rect',{x,y,width:bw,height:Math.max(1,h),rx:3,fill:color});
    r.append(svgEl('title',{},`${d.label}: ${d.value}`));svg.append(r);
    if(i%Math.ceil(data.length/8)===0) svg.append(svgEl('text',{x:x+bw/2,y:H-pad+12,'text-anchor':'middle','font-size':9},d.label));
  });
  return svg;
}
// horizontal bars (labeled categories)
function hbars(data){
  const max=Math.max(1,...data.map(d=>d.value));
  const wrap=el('div',{});
  data.forEach(d=>{
    const row=el('div',{style:'display:flex;align-items:center;gap:.5rem;margin:.25rem 0'});
    row.append(el('div',{style:'width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',class:'muted',title:d.label},d.label));
    const track=el('div',{style:'flex:1;background:var(--line);border-radius:4px;height:14px'});
    track.append(el('div',{style:`width:${100*d.value/max}%;background:var(--accent);height:100%;border-radius:4px`}));
    row.append(track,el('div',{class:'num',style:'width:3rem;text-align:right;font-variant-numeric:tabular-nums'},String(d.value)));
    wrap.append(row);
  });
  return wrap;
}
function svgEl(t,a={},...c){const n=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)n.setAttribute(k,a[k]);c.forEach(x=>n.append(x));return n;}

// ---- Settings ---------------------------------------------------------------
async function ensurePolicy(){ if(!policy) policy=await api('/api/policy'); policy.settings??={};policy.whitelist??=[];policy.blacklist??=[]; }
const SETTINGS_FIELDS=[
  ['highscore','High spam score','number'],
  ['lowscore','Low spam score','number'],
  ['def_spam','Scan for spam',['yes','no']],
  ['def_virus','Scan for viruses',['yes','no']],
  ['def_lspam','Low-spam action',['deliver','delete','spambox','forward']],
  ['def_hspam','High-spam action',['deliver','delete','spambox','forward']],
  ['def_dvirus','Deliver disinfected',['yes','no']],
  ['store','Store copies (quarantine)',['yes','no']],
];
async function renderSettings(){
  const v=$('#view');v.innerHTML='';await ensurePolicy();
  const card=el('div',{class:'card'},el('h2',{},'Global scanning policy'));
  const grid=el('div',{class:'grid2'});
  SETTINGS_FIELDS.forEach(([k,lbl,type])=>{
    const cur=policy.settings[k]??'';
    let input;
    if(Array.isArray(type)){input=el('select');type.forEach(o=>input.append(el('option',{value:o,...(o===cur?{selected:'selected'}:{})},o)));}
    else input=el('input',{type,value:cur});
    input.dataset.key=k;
    grid.append(el('label',{class:'field'},lbl,input));
  });
  card.append(grid);
  const save=el('button',{class:'act'},'Save & apply');
  save.onclick=async()=>{
    save.disabled=true;
    grid.querySelectorAll('[data-key]').forEach(i=>policy.settings[i.dataset.key]=i.value);
    const r=await api('/api/policy',{method:'PUT',body:policy});
    save.disabled=false;
    toast(r&&r.ok?`Saved — ${r.files} rule files written`:'Save failed');
  };
  card.append(save);v.append(card);
}

// ---- Lists ------------------------------------------------------------------
async function renderLists(){
  const v=$('#view');v.innerHTML='';await ensurePolicy();
  const mk=(title,key,hint)=>{
    const ta=el('textarea',{spellcheck:'false'});ta.value=(policy[key]||[]).join('\n');ta.dataset.key=key;
    return el('div',{class:'card'},el('h2',{},title),el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},hint),ta);
  };
  const row=el('div',{class:'row'});
  row.append(mk('Whitelist','whitelist','One address/pattern per line, e.g. *@partner.example'),
              mk('Blacklist','blacklist','One address/pattern per line, e.g. *@spammer.example'));
  const save=el('button',{class:'act'},'Save & apply');
  save.onclick=async()=>{
    save.disabled=true;
    v.querySelectorAll('[data-key]').forEach(ta=>policy[ta.dataset.key]=ta.value.split('\n').map(s=>s.trim()).filter(Boolean));
    const r=await api('/api/policy',{method:'PUT',body:policy});
    save.disabled=false;
    toast(r&&r.ok?`Saved — ${r.files} rule files written`:'Save failed');
  };
  v.append(row,save);
}

// ---- Messages (MailControl-style: filters, search, pagination, detail) -------
const msgF={status:'all',field:'from',text:'',offset:0,limit:50};
let msgTimer=null;
// shared by the list and the single-message view (which is a top-level render)
const fmtSize=b=>{b=+b||0;return b>1048576?(b/1048576).toFixed(1)+'MB':b>1024?Math.round(b/1024)+'KB':b+'B';};
function badgeFor(m){
  let col='var(--good)',lbl='clean';
  if(m.virus)      {col='var(--critical)';lbl='infected';}
  else if(m.ishighspam){col='var(--serious)';lbl='high spam';}
  else if(m.isspam){col='var(--warning)';lbl='spam';}
  else if(m.wl)    {col='var(--good)';lbl='whitelist';}
  else if(m.bl)    {col='var(--ink2)';lbl='blacklist';}
  return el('span',{class:'badge',style:'background:'+col},lbl+(m.quarantined?' 🔒':''));
}
async function renderMessages(){
  const v=$('#view');v.innerHTML='';
  clearInterval(msgTimer);msgTimer=null;
  const card=el('div',{class:'card'},el('h2',{},'Messages'));v.append(card);

  // status filter buttons
  const FILTERS=[['all','All','var(--accent)'],['clean','Clean','var(--good)'],['lowspam','Low Spam','var(--warning)'],
    ['highspam','High Spam','var(--serious)'],['infected','Infected','var(--critical)'],
    ['wl','Whitelist','var(--good)'],['bl','Blacklist','var(--ink2)'],['quarantined','Quarantined','var(--muted)']];
  const fbar=el('div',{class:'ctl',style:'flex-wrap:wrap'});
  FILTERS.forEach(([key,lbl,color])=>{
    const b=el('button',{class:'act plain',style:msgF.status===key?`border-color:${color};color:${color};font-weight:700`:''},lbl);
    b.onclick=()=>{msgF.status=key;msgF.offset=0;renderMessages();};
    fbar.append(b);
  });
  card.append(fbar);

  // search + refresh controls
  const sbar=el('div',{class:'ctl'});
  const fsel=el('select');[['from','From'],['to','To'],['subject','Subject'],['id','Message ID'],['ip','Client IP']].forEach(([val,lbl])=>fsel.append(el('option',{value:val,...(val===msgF.field?{selected:'selected'}:{})},lbl)));
  const stxt=el('input',{placeholder:'search…',value:msgF.text,style:'width:16rem'});
  stxt.onkeydown=e=>{if(e.key==='Enter')doSearch();};
  function doSearch(){msgF.field=fsel.value;msgF.text=stxt.value.trim();msgF.offset=0;renderMessages();}
  const auto=el('input',{type:'checkbox',id:'msgauto',...(msgTimer?{checked:'checked'}:{})});
  auto.onchange=()=>{clearInterval(msgTimer);msgTimer=auto.checked?setInterval(loadList,10000):null;};
  sbar.append(fsel,stxt,
    Object.assign(el('button',{class:'act plain'},'Search'),{onclick:doSearch}),
    Object.assign(el('button',{class:'act plain'},'Refresh'),{onclick:()=>loadList()}),
    auto,el('label',{for:'msgauto',class:'muted'},'auto-refresh (10s)'));
  card.append(sbar);

  const info=el('div',{class:'muted',style:'margin:.3rem 0'});
  const t=el('table');
  const detail=el('div',{class:'card',style:'display:none'});
  card.append(info,t);v.append(detail);

  async function loadList(){
    const q=`status=${msgF.status}&field=${msgF.field}&text=${encodeURIComponent(msgF.text)}&offset=${msgF.offset}&limit=${msgF.limit}`;
    const data=await api('/api/messages?'+q);
    t.innerHTML='';info.innerHTML='';
    if(!data||!data.available){t.append(el('tr',{},el('td',{class:'empty'},'No data yet — check the setup card on the Dashboard.')));return;}
    const total=data.total||0,page=Math.floor(msgF.offset/msgF.limit)+1,pages=Math.max(1,Math.ceil(total/msgF.limit));
    info.append(`Results: ${total} — page ${page}/${pages}  `);
    const nav=(lbl,off,dis)=>Object.assign(el('button',{class:'act plain',style:'margin-left:.3rem',...(dis?{disabled:'disabled'}:{})},lbl),{onclick:()=>{msgF.offset=off;loadList();}});
    info.append(nav('⟨ prev',Math.max(0,msgF.offset-msgF.limit),msgF.offset===0),
                nav('next ⟩',msgF.offset+msgF.limit,msgF.offset+msgF.limit>=total));
    const jump=el('input',{type:'number',min:1,max:pages,value:page,style:'width:4.5rem;margin-left:.5rem'});
    jump.onchange=()=>{msgF.offset=(Math.min(pages,Math.max(1,+jump.value))-1)*msgF.limit;loadList();};
    info.append(' jump: ',jump);
    if(!data.items||!data.items.length){t.append(el('tr',{},el('td',{class:'empty'},'No messages match.')));return;}
    t.append(el('tr',{},...['Time','Score','From / To','Subject','Size','Status'].map(h=>el('th',{},h))));
    data.items.forEach(m=>{
      const tr=el('tr',{style:'cursor:pointer'},
        el('td',{class:'muted',style:'white-space:nowrap'},m.ts),
        el('td',{class:'num'},m.score||'0'),
        el('td',{},el('div',{},m.from),el('div',{class:'muted'},m.to)),
        el('td',{},m.subject),
        el('td',{class:'num'},fmtSize(m.size)),
        el('td',{},badgeFor(m)));
      tr.onclick=()=>showDetail(m.id);
      t.append(tr);
    });
  }
  function showDetail(id){ location.hash='#msg='+encodeURIComponent(id); renderMessageView(id); }
  loadList();
}

// Full single-message view (its own screen).
async function renderMessageView(id){
  const v=$('#view');v.innerHTML='';
  const back=Object.assign(el('button',{class:'act plain'},'← Back to messages'),{onclick:()=>{location.hash='';renderMessages();}});
  v.append(el('div',{class:'ctl'},back));
  const card=el('div',{class:'card'},el('h2',{},'Message '+id),el('div',{class:'muted'},'Loading…'));v.append(card);
  const d=await api('/api/messages/detail?id='+encodeURIComponent(id));
  card.innerHTML='';
  if(!d||!d.available){card.append(el('div',{class:'empty'},'No detail available (the message may have aged out of the log).'));return;}

  let lbl='Clean';
  if(d.virus||d.nameinfected||d.otherinfected)lbl='Infected';
  else if(d.ishighspam)lbl='High Scoring Spam';else if(d.isspam)lbl='Low Scoring Spam';
  else if(d.wl)lbl='Whitelisted';else if(d.bl)lbl='Blacklisted';
  card.append(el('h2',{},'Message '+d.id,' ',badgeFor(d)));

  const dt=el('table');
  const row=(k,val)=>{if(val!=null&&String(val).trim()!=='')dt.append(el('tr',{},el('th',{style:'width:12rem'},k),el('td',{style:'word-break:break-word'},String(val))));};
  row('Scan status',lbl);row('Message ID',d.id);row('Date received',d.ts);
  row('From',d.from);row('To',d.to);row('Subject',d.subject);
  row('Size',fmtSize(d.size)+` (${d.size} bytes)`);row('Client IP',d.clientip);row('Scanned on',d.hostname);
  row('Spam report',d.spamreport);row('RBL report',d.rblreport);
  card.append(dt);

  if((d.components||[]).length){
    const sc=el('div',{class:'card'},el('h2',{},'Spam report (components)'));v.append(sc);
    const ct=el('table');ct.append(el('tr',{},...['Rule','Score','Description'].map(h=>el('th',{},h))));
    (d.components||[]).forEach(c=>ct.append(el('tr',{},
      el('td',{style:'font-family:ui-monospace,monospace'},c.rule),
      el('td',{class:'num',style:'color:'+(+c.score>0?'var(--serious)':'var(--good)')},c.score),
      el('td',{class:'muted'},c.desc||''))));
    ct.append(el('tr',{},el('th',{},'SpamAssassin score'),el('td',{class:'num'},d.score),el('td',{})));
    sc.append(ct);
  }

  if((d.header_ips||[]).length){
    const hc=el('div',{class:'card'},el('h2',{},'Header IPs'),
      el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.4rem'},'Only the last IP outside your network in the Received: chain can be trusted — the others can be spoofed.'));
    v.append(hc);
    const ht=el('table');ht.append(el('tr',{},...['IP','HELO / Hostname'].map(h=>el('th',{},h))));
    (d.header_ips||[]).forEach(h=>ht.append(el('tr',{},el('td',{style:'font-family:ui-monospace,monospace'},h.ip),el('td',{},h.host||''))));
    hc.append(ht);
  }

  if(d.headers){const hc=el('div',{class:'card'},el('h2',{},'Headers'),el('pre',{class:'log',style:'max-height:20rem'},d.headers));v.append(hc);}

  // Source + rendered views (quarantined only — the body isn't stored otherwise)
  const vc=el('div',{class:'card'},el('h2',{},'Message content'));v.append(vc);
  if(d.quarantined){
    vc.append(el('div',{class:'ctl'},
      Object.assign(el('button',{class:'act plain'},'View source'),{onclick:()=>openRaw(d.id,'source')}),
      Object.assign(el('button',{class:'act plain'},'View rendered'),{onclick:()=>openRaw(d.id,'rendered')})));
    if(d.content)vc.append(el('div',{class:'muted',style:'font-size:.8rem;margin:.4rem 0'},'Preview (first 10KB):'),el('pre',{class:'log',style:'max-height:18rem'},d.content));
  } else {
    vc.append(el('div',{class:'muted'},'Full content and rendering are available only for quarantined messages (the body of a delivered message is not stored).'));
  }

  // Actions: SpamAssassin Bayes training + release (quarantined only)
  if(d.quarantined){
    const ac=el('div',{class:'card'},el('h2',{},'Actions'),
      el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.5rem'},'Bayes training uses the quarantined copy. Release re-sends the message through Exim.'));
    v.append(ac);
    const out=el('pre',{class:'log',style:'display:none;max-height:12rem'});
    async function learn(action,warn){
      if(warn&&!confirm(warn))return;
      out.style.display='';out.textContent='▶ '+action+'…';
      const r=await api('/api/messages/learn',{method:'POST',body:{id:d.id,action}});
      out.textContent=(r.transcript||[r.error||'no response']).join('\n');
      toast(r&&r.ok?action+': done':(action+' failed — see output'));
    }
    ac.append(el('div',{class:'ctl',style:'flex-wrap:wrap'},
      Object.assign(el('button',{class:'act plain'},'Learn as ham'),{onclick:()=>learn('ham')}),
      Object.assign(el('button',{class:'act plain'},'Learn as spam'),{onclick:()=>learn('spam')}),
      Object.assign(el('button',{class:'act plain'},'Learn as spam & report'),{onclick:()=>learn('report','Learn as spam AND report to the collaborative networks (Razor/Pyzor/DCC)?')}),
      Object.assign(el('button',{class:'act plain'},'Forget'),{onclick:()=>learn('forget','Make SpamAssassin forget this message from its Bayes database?')})));
    const rto=el('input',{placeholder:'recipient (empty = original To:)',style:'width:22rem'});
    ac.append(el('div',{class:'ctl'},rto,
      Object.assign(el('button',{class:'act'},'Release (resend)'),{onclick:()=>release(d.id,'',rto)}),
      Object.assign(el('button',{class:'act'},'Release (forward)'),{onclick:()=>release(d.id,rto.value.trim(),rto)})));
    ac.append(out);
  }
  window.scrollTo(0,0);

  async function release(id,to,inp){
    if(to&&!/^[^\s@]+@[^\s@]+$/.test(to)){toast('Enter a valid recipient to forward');return;}
    if(!confirm('Release this message'+(to?` (forward) to ${to}`:' (resend) to its original recipients')+'?'))return;
    const r=await api('/api/messages/release',{method:'POST',body:{id,to}});
    toast(r&&r.ok?'Released — on its way':(r.error||'release failed'));
  }
}

// Open a quarantined message's raw source or rendered HTML in a new tab.
async function openRaw(id,mode){
  const raw=await api('/api/messages/raw?id='+encodeURIComponent(id),{raw:true});
  const w=window.open('','_blank');
  if(!w){toast('Pop-up blocked — allow pop-ups to view');return;}
  if(mode==='source'){
    w.document.write('<pre style="white-space:pre-wrap;word-break:break-word;font:13px ui-monospace,monospace;padding:1rem">'+
      raw.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>');
  } else {
    // split headers/body; render the body sandboxed (no scripts, no network by CSP)
    const i=raw.search(/\r?\n\r?\n/);
    const body=i>=0?raw.slice(i).replace(/^\s+/,''):raw;
    w.document.write('<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'+
      '<div style="font:13px system-ui;padding:.5rem;background:#fffbe6;border-bottom:1px solid #e5c07b">Rendered preview — scripts and remote content are blocked for safety.</div>'+body);
  }
  w.document.close();
}

// ---- Rules (structured editor, no raw tabs/spaces) ---------------------------
const DIRS=['To:','From:','FromOrTo:','FromAndTo:'];
async function renderRules(){
  const v=$('#view');v.innerHTML='';
  const files=await api('/api/rules/files');
  const names=(files.files||[]).map(f=>f.name);
  if(!names.length){v.append(el('div',{class:'empty'},'Rules API unavailable.'));return;}

  const fsel=el('select');
  (files.files||[]).forEach(f=>fsel.append(el('option',{value:f.name},f.name+(f.custom?` (${f.custom} custom)`:''))));
  const adoptAll=Object.assign(el('button',{class:'act plain'},'Borrow all current rules'),
    {title:'Absorb every rule found in the live ruleset files (any whitespace style) into the custom store, normalized. Rules already generated from policy and default lines are skipped.',
     onclick:async()=>{
      if(!confirm('Borrow all rules currently in the live ruleset files?\n\nEvery rule not already generated from policy is copied into the custom store (normalized to canonical form) so it survives future syncs. Default lines are skipped — defaults come from policy.'))return;
      adoptAll.disabled=true;
      const r=await api('/api/rules/adopt',{method:'POST',body:{}});
      adoptAll.disabled=false;
      if(r&&r.ok){
        toast(`${r.adopted} rule(s) borrowed`+(r.skipped_defaults?`, ${r.skipped_defaults} default(s) skipped`:'')+(r.unparsed?`, ${r.unparsed} unparsable ignored`:''));
        renderRules();
      } else toast(r.error||'adopt failed');
     }});
  v.append(el('div',{class:'ctl'},el('span',{class:'muted'},'Ruleset:'),fsel,adoptAll));

  // Custom rules editor
  const cc=el('div',{class:'card'},el('h2',{},'Custom rules'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Structured rules merged ahead of the generated domain rules (first match wins) — they survive every sync. Patterns are single tokens like *@domain or user@domain; the value is the action (yes, no, deliver, delete, forward addr@x delete, a spam score…). Formatting is handled for you — no tabs to get wrong.'));
  const rtable=el('table');cc.append(rtable);
  const addBtn=el('button',{class:'act plain'},'+ Add rule');
  const saveBtn=el('button',{class:'act'},'Save & apply');
  cc.append(el('div',{class:'ctl',style:'margin-top:.6rem'},addBtn,saveBtn));
  v.append(cc);

  function rowFor(r){
    const tr=el('tr',{class:'crow'});
    const dsel=el('select',{'data-f':'direction'});DIRS.forEach(d=>dsel.append(el('option',{value:d,...(d===r.direction?{selected:'selected'}:{})},d)));
    const adsel=el('select',{'data-f':'and_direction'});[['',''],...DIRS.map(d=>[d,'and '+d])].forEach(([val,lbl])=>adsel.append(el('option',{value:val,...(val===(r.and_direction||'')?{selected:'selected'}:{})},lbl)));
    tr.append(
      el('td',{},dsel),
      el('td',{},el('input',{'data-f':'pattern',value:r.pattern||'',placeholder:'*@domain.example'})),
      el('td',{},adsel),
      el('td',{},el('input',{'data-f':'and_pattern',value:r.and_pattern||'',placeholder:'(pattern)'})),
      el('td',{},el('input',{'data-f':'value',value:r.value||'',placeholder:'yes / deliver / delete …'})),
      el('td',{},Object.assign(el('button',{class:'act plain'},'✕'),{onclick:()=>tr.remove()})));
    return tr;
  }
  function drawEditor(rules){
    rtable.innerHTML='';
    rtable.append(el('tr',{},...['Direction','Pattern','','and-pattern','Value',''].map(h=>el('th',{},h))));
    rules.forEach(r=>rtable.append(rowFor(r)));
  }
  addBtn.onclick=()=>rtable.append(rowFor({direction:'To:'}));
  saveBtn.onclick=async()=>{
    const rules=[...rtable.querySelectorAll('tr.crow')].map(tr=>{
      const g=f=>tr.querySelector(`[data-f="${f}"]`).value.trim();
      return {direction:g('direction'),pattern:g('pattern'),and_direction:g('and_direction'),and_pattern:g('and_pattern'),value:g('value')};
    });
    saveBtn.disabled=true;
    const r=await api('/api/rules/custom',{method:'PUT',body:{file:fsel.value,rules}});
    saveBtn.disabled=false;
    toast(r&&r.ok?`Saved — ${r.files} rule files written, reload ${r.reloaded?'ok':'failed'}`:(r.error||'save failed'));
    if(r&&r.ok)loadLive();
  };

  // Live file view with stray detection
  const lc=el('div',{class:'card'},el('h2',{},'Live ruleset file'));v.append(lc);
  const lhead=el('div',{class:'statline'});const ltable=el('table');
  lc.append(lhead,ltable);
  async function loadLive(){
    const d=await api('/api/rules/live?file='+encodeURIComponent(fsel.value));
    lhead.innerHTML='';ltable.innerHTML='';
    if(d.error){lhead.append(el('span',{class:'muted'},d.error));return;}
    lhead.append(el('span',{class:'muted'},d.path));
    if(d.strays>0){
      lhead.append(el('span',{style:'color:var(--serious)'},`${d.strays} stray rule(s) — hand edits that the next sync will wipe`),
        Object.assign(el('button',{class:'act plain'},'Adopt strays as custom rules'),{onclick:async()=>{
          const r=await api('/api/rules/adopt',{method:'POST',body:{file:fsel.value}});
          toast(r&&r.ok?`${r.adopted} rule(s) adopted (normalized to canonical form)`:(r.error||'adopt failed'));
          load();
        }}));
    }
    if(d.unparsed>0)lhead.append(el('span',{style:'color:var(--critical)'},`${d.unparsed} unparsable line(s)`));
    ltable.append(el('tr',{},...['','Direction','Pattern','Value'].map(h=>el('th',{},h))));
    (d.lines||[]).forEach(l=>{
      if(l.kind==='comment')ltable.append(el('tr',{},el('td',{}),el('td',{class:'muted',colspan:'3'},l.text)));
      else if(l.kind==='unparsed')ltable.append(el('tr',{},
        el('td',{},el('span',{class:'badge',style:'background:var(--critical)'},'bad')),
        el('td',{class:'muted',colspan:'3',style:'font-family:ui-monospace,monospace'},l.text)));
      else ltable.append(el('tr',{},
        el('td',{},l.stray?el('span',{class:'badge',style:'background:var(--serious)'},'stray'):''),
        el('td',{},l.direction+(l.and_direction?` … and ${l.and_direction}`:'')),
        el('td',{style:'font-family:ui-monospace,monospace'},l.pattern+(l.and_pattern?`  /  ${l.and_pattern}`:'')),
        el('td',{},l.value)));
    });
  }

  async function load(){
    const d=await api('/api/rules/custom?file='+encodeURIComponent(fsel.value));
    drawEditor(d.rules||[]);
    loadLive();
  }
  fsel.onchange=load;
  load();
}

// ---- Service ----------------------------------------------------------------
async function renderService(){
  const v=$('#view');v.innerHTML='';

  // MailScanner service card
  const svc=el('div',{class:'card'},el('h2',{},'MailScanner service'));v.append(svc);
  const stat=el('div',{class:'statline'},el('span',{class:'muted'},'Loading status…'));svc.append(stat);
  const latch=el('div',{class:'statline'});svc.append(latch);
  const btns=el('div',{class:'ctl'});svc.append(btns);
  async function refreshStatus(){
    const s=await api('/api/service/status');
    stat.innerHTML='';
    if(s.error){stat.append(el('span',{class:'muted'},'Status unavailable'));return;}
    if(s.engine===false||s.engine_configured===false){
      stat.append(el('div',{style:'flex-basis:100%;color:var(--critical);font-weight:600'},
        s.engine===false
          ?'⚠ MailScanner engine is not installed — mail is NOT being scanned. Install it with "msfe-ng engine install" (or reinstall MSFE-NG with --with-engine).'
          :'⚠ MailScanner engine is installed but /etc/MailScanner/MailScanner.conf is missing — run "msfe-ng engine install" to repair.'));
    } else if(s.engine_run_enabled===false){
      stat.append(el('div',{style:'flex-basis:100%;color:var(--warning);font-weight:600'},
        '⚠ MailScanner cannot start: its safety switch is OFF. Turn it on below when you are ready.'));
    }
    latch.innerHTML='';
    if(s.engine!==false&&s.engine_configured!==false&&typeof s.engine_run_enabled==='boolean'){
      const on=s.engine_run_enabled;
      latch.append(
        el('span',{},el('span',{class:'dot',style:'background:'+(on?'var(--good)':'var(--warning)')}),
          'Safety switch: '+(on?'ON — MailScanner is allowed to run':'OFF — MailScanner cannot start')),
        Object.assign(el('button',{class:'act plain'},on?'Turn OFF (block MailScanner)':'Turn ON (allow MailScanner to run)'),{onclick:async()=>{
          const msg=on
            ?'Turn the safety switch OFF?\n\nMailScanner will refuse to start until you turn it back on.'
            :'Turn the safety switch ON?\n\nThis allows the MailScanner service to be started. It does NOT change how mail flows — Exim must still be wired to MailScanner before anything is scanned.';
          if(!confirm(msg))return;
          const r=await api('/api/service/engine-latch',{method:'POST',body:{enabled:!on}});
          toast(r&&r.ok?('Safety switch is now '+(r.run_enabled?'ON':'OFF')):(r.error||'failed'));
          refreshStatus();
        }}));
    }
    if(s.engine!==false){
      stat.append(el('span',{style:'font-weight:600'},
        el('span',{class:'dot',style:'background:'+(s.wired?'var(--good)':'var(--warning)')}),
        s.wired?'Mail is routed through MailScanner':'Mail is delivered directly (not scanned)'));
      wireBtn.textContent=s.wired?'Unwire (stop scanning mail)':'Wire Exim → MailScanner';
      wireBtn.dataset.wired=s.wired?'1':'0';
      wireBtn.className=s.wired?'act danger':'act';
    }
    stat.append(
      el('span',{},el('span',{class:'dot',style:'background:'+(s.active?'var(--good)':'var(--critical)')}),
        s.active?'Running':'Stopped',s.procs?` (${s.procs} processes)`:''),
      el('span',{},el('span',{class:'dot',style:'background:'+(s.scanning?'var(--good)':'var(--warning)')}),
        'Scanning '+(s.scanning?'enabled':'disabled (mail bypasses MailScanner)')),
      el('span',{class:'muted'},`Queues: ${s.queues?.incoming??'?'} incoming · ${s.queues?.outgoing??'?'} outgoing`));
    mfBtn.textContent=s.scanning?'Disable MailScanner (mailflow)':'Enable MailScanner (mailflow)';
    mfBtn.dataset.enable=s.scanning?'false':'true';
  }
  // Activity console: shows the exact commands run + their output, then keeps
  // the MailScanner journal refreshing so startup progress/errors are visible.
  const con=el('div',{class:'card',style:'display:none'},el('h2',{},'Activity console'));
  const conCmd=el('pre',{class:'log',style:'max-height:10rem'});
  const conJ=el('pre',{class:'log'});
  con.append(conCmd,
    el('div',{class:'muted',style:'margin:.5rem 0 .25rem;font-size:.8rem'},'MailScanner journal (refreshing for ~20s after an action):'),
    conJ);
  function pollJournal(){
    clearInterval(jrnTimer);let n=0;
    const tick=async()=>{
      conJ.textContent=await api('/api/service/journal?lines=60',{raw:true});
      conJ.scrollTop=conJ.scrollHeight;
      refreshStatus();
      if(++n>=10){clearInterval(jrnTimer);jrnTimer=null;}
    };
    tick();jrnTimer=setInterval(tick,2000);
  }
  async function ctl(action,confirmMsg){
    if(confirmMsg&&!confirm(confirmMsg))return;
    con.style.display='';
    conCmd.textContent+=(conCmd.textContent?'\n':'')+`▶ ${action} — ${new Date().toLocaleTimeString()}`;
    const r=await api('/api/service/control',{method:'POST',body:{action}});
    (r.transcript||[r.error||'no response from daemon']).forEach(l=>{conCmd.textContent+='\n  '+l;});
    conCmd.textContent+='\n  result: '+(r.ok?'success':'FAILED')+(typeof r.procs==='number'?` — ${r.procs} process(es), ${r.active?'active':'not active'}`:'');
    conCmd.scrollTop=conCmd.scrollHeight;
    toast(r&&r.ok?`MailScanner ${action}: ok`:`${action} failed — see console`);
    refreshStatus();
    pollJournal();
  }
  const stopWarn='Stop the MailScanner processes?\n\nNo email will be delivered while the MailScanner processes are stopped.';
  btns.append(
    Object.assign(el('button',{class:'act'},'Start'),{onclick:()=>ctl('start')}),
    Object.assign(el('button',{class:'act danger'},'Stop'),{onclick:()=>ctl('stop',stopWarn)}),
    Object.assign(el('button',{class:'act plain'},'Reload'),{onclick:()=>ctl('reload')}),
    Object.assign(el('button',{class:'act plain'},'Restart'),{onclick:()=>ctl('restart','Restart the MailScanner processes?')}));
  const mfBtn=el('button',{class:'act plain'},'…');
  mfBtn.onclick=async()=>{
    const enable=mfBtn.dataset.enable==='true';
    if(!enable&&!confirm('Disable MailScanner?\n\nMail delivery goes back to Exim only. Any email in the MailScanner queue will not be processed until MailScanner is re-enabled.'))return;
    const r=await api('/api/service/mailflow',{method:'POST',body:{enabled:enable}});
    toast(r&&r.ok?('Scanning '+(r.scanning?'enabled':'disabled')):(r.error||'failed'));
    refreshStatus();
  };
  const cfgBtn=el('button',{class:'act plain'},'Configure for Exim');
  cfgBtn.onclick=async()=>{
    if(!confirm('Configure MailScanner for this server?\n\nSets MailScanner.conf up for Exim (queue directories, run-as user, sendmail paths — a backup of the original is kept) and creates the incoming spool directory.\n\nMail flow does NOT change.'))return;
    cfgBtn.disabled=true;
    const r=await api('/api/service/engine-configure',{method:'POST'});
    cfgBtn.disabled=false;
    if(r&&r.ok){
      const n=(r.set||[]).length+(r.created||[]).length;
      toast(n?`Configured (${(r.set||[]).length} settings, ${(r.created||[]).length} directories) — now run the health check`:'Already configured — nothing to change');
      if((r.chown_failed||[]).length)toast('Warning: ownership not set on '+r.chown_failed.join(', '));
    } else toast(r.error||'configure failed');
    refreshStatus();
  };
  const syncBtn=el('button',{class:'act plain'},'Update rules now');
  syncBtn.onclick=async()=>{
    syncBtn.disabled=true;
    const r=await api('/api/service/sync',{method:'POST'});
    syncBtn.disabled=false;
    toast(r&&r.ok?`Rules updated — ${r.files} files, reload ${r.reloaded?'ok':'failed'}`:(r.error||'sync failed'));
  };
  btns.append(cfgBtn,mfBtn,syncBtn);

  // Exim wiring: route mail through MailScanner (named queue), or undo it.
  const wireBtn=el('button',{class:'act'},'Wire Exim → MailScanner');
  async function runWire(enable,dry){
    con.style.display='';
    conCmd.textContent+=(conCmd.textContent?'\n':'')+`▶ ${dry?'preview ':''}${enable?'wire':'unwire'} — ${new Date().toLocaleTimeString()}`;
    const r=await api('/api/service/engine-wire',{method:'POST',body:{enable,dry_run:dry}});
    (r.actions||[r.error||'no response from daemon']).forEach(l=>{conCmd.textContent+='\n  '+l;});
    conCmd.textContent+='\n  result: '+(r&&r.ok?(dry?'dry-run, nothing changed':(r.wired?'WIRED — incoming mail is being scanned':'unwired — direct delivery restored')):'FAILED '+(r.error||''));
    conCmd.scrollTop=conCmd.scrollHeight;
    if(!dry){toast(r&&r.ok?(r.wired?'Mail is now routed through MailScanner':'Direct delivery restored'):(r.error||'wiring failed'));refreshStatus();pollJournal();}
  }
  wireBtn.onclick=async()=>{
    const wired=wireBtn.dataset.wired==='1';
    const msg=wired
      ?'Stop routing mail through MailScanner?\n\nMail will be delivered directly again, WITHOUT scanning. MailScanner keeps running idle and this can be re-wired at any time.'
      :'Route ALL incoming mail through MailScanner?\n\nExim will hold each incoming message in a scanning queue; MailScanner scans it and hands it back for delivery. Undo at any time with Unwire — and the mailflow toggle stays an instant kill switch.';
    if(!confirm(msg))return;
    wireBtn.disabled=true;await runWire(!wired,false);wireBtn.disabled=false;
  };
  const previewBtn=el('button',{class:'act plain'},'Preview wiring (dry-run)');
  previewBtn.onclick=()=>runWire(wireBtn.dataset.wired!=='1',true);
  svc.append(el('div',{class:'ctl'},wireBtn,previewBtn));
  v.append(con);

  // Health check: MailScanner's own self-test, with a plain verdict.
  const hc=el('div',{class:'card'},el('h2',{},'Health check'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      "Runs MailScanner's built-in self-check: configuration, required modules, virus scanner and spam engine. Safe to run any time — it does not touch mail."));
  const hcVerdict=el('div',{class:'statline'});
  const hcBtn=el('button',{class:'act'},'Test that everything is OK');
  const hcOut=el('pre',{class:'log',style:'display:none'});
  hcBtn.onclick=async()=>{
    hcBtn.disabled=true;hcOut.style.display='none';
    hcVerdict.innerHTML='';hcVerdict.append(el('span',{class:'muted'},'Testing — this can take up to a minute…'));
    const r=await api('/api/service/lint',{method:'POST'});
    hcBtn.disabled=false;hcVerdict.innerHTML='';
    if(r&&r.ok)hcVerdict.append(el('span',{style:'color:var(--good);font-weight:600'},'✅ Everything is OK — MailScanner’s self-check passed.'));
    else hcVerdict.append(el('span',{style:'color:var(--critical);font-weight:600'},'❌ Problems found — details below.'));
    hcOut.textContent=(r&&r.output)||r.error||'(no output)';
    hcOut.style.display='';
  };
  hc.append(hcVerdict,hcBtn,hcOut);
  v.append(hc);

  // Queue card
  const qc=el('div',{class:'card'},el('h2',{},'Mail queues'));v.append(qc);
  const qbody=el('div',{},el('span',{class:'muted'},'Checking queues…'));qc.append(qbody);
  async function refreshQueue(){
    const q=await api('/api/service/queue');
    qbody.innerHTML='';
    if(q.error){qbody.append(el('span',{class:'muted'},'Queue check unavailable'));return;}
    qbody.append(el('div',{class:'statline'},
      el('span',{},`Incoming: ${q.incoming} `,el('span',{class:'muted'},`(${q.incoming_dir})`)),
      el('span',{},`Outgoing: ${q.outgoing} `,el('span',{class:'muted'},`(${q.outgoing_dir})`)),
      el('span',{},(q.orphans||[]).length
        ? el('span',{style:'color:var(--serious)'},`${q.orphans.length} incorrectly queued file(s)`)
        : el('span',{style:'color:var(--good)'},'No incorrectly queued emails'))));
    if((q.orphans||[]).length)
      qbody.append(el('pre',{class:'log'},q.orphans.join('\n')));
  }
  const qbtns=el('div',{class:'ctl'});qc.append(qbtns);
  qbtns.append(
    Object.assign(el('button',{class:'act plain'},'Re-check'),{onclick:refreshQueue}),
    Object.assign(el('button',{class:'act'},'Fix queues & force delivery run'),{onclick:async()=>{
      if(!confirm('Move incorrectly queued files aside (kept in msfe-ng-badqueue, never deleted) and force an Exim queue run?'))return;
      const r=await api('/api/service/queue/fix',{method:'POST'});
      toast(r&&r.ok?`${r.moved} file(s) moved, delivery run ${r.flush_started?'started':'not started'}`:(r.error||'fix failed'));
      refreshQueue();
    }}));

  // User view + update card
  const uc=el('div',{class:'row'});v.append(uc);
  if(!DIRECT){
    const imp=el('div',{class:'card'},el('h2',{},'View as user'),
      el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},'Opens the end-user settings UI for an account in a new tab (impersonated, admin-only).'));
    const uin=el('input',{placeholder:'account name'});
    imp.append(el('div',{class:'ctl'},uin,
      Object.assign(el('button',{class:'act plain'},'Open as user'),{onclick:()=>{
        const u=uin.value.trim();
        if(!/^[a-z0-9._-]+$/i.test(u)){toast('Enter a valid account name');return;}
        window.open(location.pathname.split('?')[0]+'?embedded=1&msfe_user='+encodeURIComponent(u),'_blank');
      }})));
    uc.append(imp);
  }
  const up=el('div',{class:'card'},el('h2',{},'Updates'));
  const upline=el('div',{class:'statline'},el('span',{class:'muted'},'MSFE-NG v{{VERSION}}'));
  const upBtn=el('button',{class:'act plain'},'Check for updates');
  upBtn.onclick=async()=>{
    upBtn.disabled=true;
    const r=await api('/api/service/update');
    upBtn.disabled=false;
    upline.innerHTML='';
    if(!r||!r.latest){upline.append(el('span',{class:'muted'},'Could not reach the release server.'));return;}
    if(r.latest===r.current)upline.append(el('span',{style:'color:var(--good)'},`v${r.current} — up to date`));
    else upline.append(el('span',{style:'color:var(--warning)'},`v${r.latest} available (installed v${r.current}) — `),
      el('a',{href:'https://github.com/inalto/msfe-ng/releases',target:'_blank'},'release notes'));
  };
  up.append(upline,upBtn);uc.append(up);

  refreshStatus();refreshQueue();
}

// ---- Logs & queue contents ---------------------------------------------------
async function renderLogs(){
  const v=$('#view');v.innerHTML='';

  // Log viewer (mail log + exim mainlog) with follow
  const lc=el('div',{class:'card'},el('h2',{},'Logs'));v.append(lc);
  const lctl=el('div',{class:'ctl'});lc.append(lctl);
  const lsrc=el('select');[['mail','Mail log (MailScanner/syslog)'],['exim','Exim mainlog (deliveries)']].forEach(([val,lbl])=>lsrc.append(el('option',{value:val},lbl)));
  const lsel=el('select');[100,300,1000].forEach(n=>lsel.append(el('option',{value:n},n+' lines')));
  const pre=el('pre',{class:'log',style:'max-height:30rem'},'Loading…');
  async function refreshLog(){
    const which=lsrc.value==='exim'?'&which=exim':'';
    const text=await api('/api/service/maillog?lines='+lsel.value+which,{raw:true});
    const stick=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-4;
    pre.textContent=text||'(empty)';
    if(stick)pre.scrollTop=pre.scrollHeight;
  }
  lsrc.onchange=()=>{pre.textContent='Loading…';refreshLog();};
  const auto=el('input',{type:'checkbox',id:'logauto'});
  auto.onchange=()=>{clearInterval(logTimer);logTimer=auto.checked?setInterval(refreshLog,5000):null;};
  lctl.append(lsrc,lsel,
    Object.assign(el('button',{class:'act plain'},'Refresh'),{onclick:refreshLog}),
    auto,el('label',{for:'logauto',class:'muted'},'follow (5s)'));
  lc.append(pre);
  refreshLog();
}

// ---- Queues (contents + per-message management) ------------------------------
async function renderQueues(){
  const v=$('#view');v.innerHTML='';
  const qc=el('div',{class:'card'},el('h2',{},'Queue contents'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Live listing (exim -bp): age, size, message id, sender and recipients. Messages sit in the MailScanner queue only for the seconds between arrival and scanning — anything older means MailScanner is not processing.'));
  v.append(qc);
  const qctl=el('div',{class:'ctl'});qc.append(qctl);
  const qsrc=el('select');[['mailscanner','MailScanner queue (waiting for scan)'],['main','Main queue (delivery)']].forEach(([val,lbl])=>qsrc.append(el('option',{value:val},lbl)));
  const qtable=el('table');
  const qpre=el('pre',{class:'log',style:'display:none'},'');
  const qdetail=el('pre',{class:'log',style:'display:none;max-height:20rem'});
  // exim -bp: " 25m  5.3K 1wnE6V-00000004Oi2-3lJH <sender>" then indented recipients
  function parseListing(text){
    const msgs=[];let cur=null;
    text.split('\n').forEach(l=>{
      const m=l.match(/^\s*(\S+)\s+(\S+)\s+([A-Za-z0-9-]{10,30})\s+<(.*?)>(.*)$/);
      if(m){cur={age:m[1],size:m[2],id:m[3],from:m[4]||'(bounce)',frozen:/frozen/.test(m[5]),to:[]};msgs.push(cur);}
      else if(cur&&l.trim()&&!/^\d+ matches out of/.test(l)){const t=l.trim();if(/^[^\s<>]+@[^\s<>]+$/.test(t.replace(/^D\s+/,'')))cur.to.push(t);}
    });
    return msgs;
  }
  async function msgView(id,what){
    qdetail.style.display='';
    qdetail.textContent='Loading '+what+'…';
    qdetail.textContent=await api(`/api/service/queue/msg?which=${qsrc.value}&id=${encodeURIComponent(id)}&what=${what}`,{raw:true});
  }
  async function msgAction(id,action){
    const warn=action==='delete'
      ?`Delete ${id} from the queue?\n\nThe message is removed permanently.`
      :(qsrc.value==='mailscanner'
        ?`Deliver ${id} NOW from the scanning queue?\n\nThis BYPASSES MailScanner scanning for this message.`
        :`Force delivery of ${id} now (works for frozen messages too)?\n\nThis can take a while if the remote server is slow.`);
    if(!confirm(warn))return;
    qdetail.style.display='';qdetail.textContent=`▶ ${action} ${id}…`;
    const r=await api('/api/service/queue/action',{method:'POST',body:{which:qsrc.value,id,action}});
    qdetail.textContent=(r.transcript||[r.error||'no response']).join('\n');
    toast(r&&r.ok?`${action}: ok`:`${action} failed — see output`);
    refreshQ();
  }
  async function refreshQ(){
    const text=await api('/api/service/queue/listing?which='+qsrc.value,{raw:true});
    qpre.textContent=text;
    const msgs=parseListing(text);
    qtable.innerHTML='';
    if(!msgs.length){
      qtable.append(el('tr',{},el('td',{class:'muted'},text.startsWith('(')?text:'Queue is empty.')));
      return;
    }
    qtable.append(el('tr',{},...['Age','Size','Message','From','To','',''].map(h=>el('th',{},h))));
    msgs.forEach(m=>{
      qtable.append(el('tr',{},
        el('td',{},m.age),el('td',{},m.size),
        el('td',{style:'font-family:ui-monospace,monospace;font-size:.75rem'},m.id,
          m.frozen?el('span',{class:'badge',style:'background:var(--serious);margin-left:.4rem'},'frozen'):''),
        el('td',{},m.from),el('td',{},m.to.join(', ')),
        el('td',{},...['headers','body','log'].map(w=>Object.assign(el('button',{class:'act plain',style:'margin-right:.25rem'},w),{onclick:()=>msgView(m.id,w)}))),
        el('td',{},
          Object.assign(el('button',{class:'act',style:'margin-right:.25rem'},'Deliver now'),{onclick:()=>msgAction(m.id,'deliver')}),
          Object.assign(el('button',{class:'act danger'},'Delete'),{onclick:()=>msgAction(m.id,'delete')}))));
    });
  }
  qsrc.onchange=()=>{qdetail.style.display='none';refreshQ();};
  const qauto=el('input',{type:'checkbox',id:'qauto'});
  qauto.onchange=()=>{clearInterval(jrnTimer);jrnTimer=qauto.checked?setInterval(refreshQ,5000):null;};
  const qraw=el('input',{type:'checkbox',id:'qraw'});
  qraw.onchange=()=>{qpre.style.display=qraw.checked?'':'none';qtable.style.display=qraw.checked?'none':'';};
  async function repairSpool(dry){
    if(!dry&&!confirm('Move misplaced spool files into the subdirectories Exim expects, then force a delivery run?\n\nNothing is deleted. Messages Exim could not find become deliverable again.'))return;
    qdetail.style.display='';qdetail.textContent='▶ '+(dry?'checking':'repairing')+' spool placement…';
    const r=await api('/api/service/queue/repair-spool',{method:'POST',body:{dry_run:dry}});
    qdetail.textContent=(r.actions||[r.error||'no response']).join('\n')+
      (r.ok?`\n→ ${r.moved} file(s) moved${r.dry_run?' (dry-run)':(r.flush_started?', delivery run started':'')}`:'');
    if(!dry)refreshQ();
  }
  qctl.append(qsrc,
    Object.assign(el('button',{class:'act plain'},'Refresh'),{onclick:refreshQ}),
    qauto,el('label',{for:'qauto',class:'muted'},'follow (5s)'),
    qraw,el('label',{for:'qraw',class:'muted'},'raw'),
    Object.assign(el('button',{class:'act plain',title:'Check whether queued files sit in the split-spool subdirectory Exim expects'},'Check spool placement'),{onclick:()=>repairSpool(true)}),
    Object.assign(el('button',{class:'act'},'Fix misplaced spool files'),{onclick:()=>repairSpool(false)}));
  qc.append(qtable,qpre,qdetail);
  refreshQ();
}

// ---- Config files & rulesets -------------------------------------------------
async function renderConfig(){
  const v=$('#view');v.innerHTML='';

  const ec=el('div',{class:'card'},el('h2',{},'Configuration files'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'A one-time .msfe-ng.bak backup of the original is kept next to each file. Reload MailScanner after changing MailScanner.conf.'));
  v.append(ec);
  const fsel=el('select');
  [['mailscanner','MailScanner.conf'],['msfe','MSFE-NG config.toml']].forEach(([val,lbl])=>fsel.append(el('option',{value:val},lbl)));
  const pathLbl=el('span',{class:'muted'});
  let mode='visual';
  const modeBtn=el('button',{class:'act plain'},'Raw text');

  // --- raw mode (full-file textarea) ---
  const ta=el('textarea',{spellcheck:'false',style:'min-height:22rem;display:none'});
  const rawSave=el('button',{class:'act',style:'display:none'},'Save raw');
  rawSave.onclick=async()=>{
    if(!confirm('Save the whole file '+pathLbl.textContent+'?'))return;
    rawSave.disabled=true;
    const r=await api('/api/service/conf',{method:'PUT',body:{which:fsel.value,content:ta.value}});
    rawSave.disabled=false;
    if(r&&r.ok){toast(fsel.value==='mailscanner'?'Saved — reload MailScanner to apply':'Saved');}
    else toast(r.error||'save failed');
  };

  // --- visual mode (key/value fields, comments shown and preserved) ---
  const filter=el('input',{placeholder:'filter settings…',style:'flex:1;max-width:20rem'});
  const vwrap=el('div');
  const rows=el('div',{style:'max-height:32rem;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem'});
  const vSave=el('button',{class:'act'},'Save changes');
  let ORIG={};
  async function loadVisual(){
    rows.innerHTML='';ORIG={};pathLbl.textContent='loading…';
    const d=await api('/api/service/conf/parsed?which='+fsel.value);
    if(d.error){pathLbl.textContent='';rows.append(el('div',{class:'muted'},d.error));return;}
    pathLbl.textContent=d.path;
    (d.lines||[]).forEach(l=>{
      if(l.t==='comment'||l.t==='other')
        rows.append(el('div',{class:'muted',style:'font:.74rem/1.4 ui-monospace,monospace;white-space:pre-wrap'},l.text));
      else if(l.t==='entry'){
        ORIG[l.key]=l.value;
        const inp=el('input',{value:l.value,'data-k':l.key,style:'flex:1;font-size:.8rem'});
        inp.oninput=()=>{inp.style.borderColor=inp.value!==ORIG[l.key]?'var(--accent)':'';};
        rows.append(el('div',{style:'display:flex;gap:.6rem;align-items:center;margin:.15rem 0'},
          el('div',{style:'width:17rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;font-weight:600',title:l.key},l.key),inp));
      }
    });
  }
  filter.oninput=()=>{
    const q=filter.value.toLowerCase();
    [...rows.children].forEach(r=>{
      if(!q){r.style.display='';return;}
      const inp=r.querySelector?r.querySelector('[data-k]'):null;
      r.style.display=(inp&&(inp.dataset.k.toLowerCase().includes(q)||inp.value.toLowerCase().includes(q)))?'':'none';
    });
  };
  vSave.onclick=async()=>{
    const changes={};
    rows.querySelectorAll('[data-k]').forEach(i=>{if(i.value!==ORIG[i.dataset.k])changes[i.dataset.k]=i.value;});
    const n=Object.keys(changes).length;
    if(!n){toast('No changes to save');return;}
    if(!confirm(`Apply ${n} change(s) to ${pathLbl.textContent}?\n\n`+Object.entries(changes).map(([k,v])=>`${k} = ${v}`).join('\n')+'\n\nOnly these lines are rewritten — comments and everything else stay untouched.'))return;
    vSave.disabled=true;
    const r=await api('/api/service/conf/apply',{method:'POST',body:{which:fsel.value,changes}});
    vSave.disabled=false;
    if(r&&r.ok){toast(`${r.applied} setting(s) saved`+(fsel.value==='mailscanner'?' — reload MailScanner to apply':''));loadVisual();}
    else toast(r.error||'save failed');
  };
  vwrap.append(rows);

  function applyMode(){
    const vis=mode==='visual';
    vwrap.style.display=vis?'':'none';filter.style.display=vis?'':'none';vSave.style.display=vis?'':'none';
    ta.style.display=vis?'none':'';rawSave.style.display=vis?'none':'';
    modeBtn.textContent=vis?'Raw text':'Visual editor';
  }
  modeBtn.onclick=()=>{mode=mode==='visual'?'raw':'visual';applyMode();loadAny();};
  async function loadAny(){
    if(mode==='visual')return loadVisual();
    ta.value='';pathLbl.textContent='loading…';
    const r=await api('/api/service/conf?which='+fsel.value);
    if(r.error){pathLbl.textContent=r.error;return;}
    ta.value=r.content;pathLbl.textContent=r.path;
  }
  fsel.onchange=loadAny;
  ec.append(el('div',{class:'ctl'},fsel,modeBtn,filter,vSave,rawSave,pathLbl),vwrap,ta);
  applyMode();
  const loadConf=loadAny;

  const rc=el('div',{class:'card'},el('h2',{},'Generated rulesets'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Read-only: these files are regenerated by sync — edit policy, not the files.'));
  v.append(rc);
  const list=el('div',{class:'ctl',style:'flex-wrap:wrap'});
  const rpre=el('pre',{class:'log'},'Select a ruleset file to view it.');
  rc.append(list,rpre);
  const r=await api('/api/service/rules');
  (r.files||[]).forEach(f=>{
    list.append(Object.assign(el('button',{class:'act plain'},`${f.name} (${f.size} B)`),{onclick:async()=>{
      rpre.textContent=await api('/api/service/rules/view?name='+encodeURIComponent(f.name),{raw:true});
    }}));
  });
  if(!(r.files||[]).length)list.append(el('span',{class:'muted'},'No ruleset files in '+(r.dir||'rules dir')+' yet — run sync.'));

  loadConf();
}

// Doctor banner: shown on every tab whenever any chain link is unhealthy.
async function refreshDoctor(){
  const bar=$('#doctorbar');
  const d=await api('/api/doctor');
  const probs=(d.checks||[]).filter(c=>c.level!=='ok');
  if(!probs.length){bar.style.display='none';return;}
  const fails=probs.filter(c=>c.level==='fail').length;
  bar.style.display='';bar.innerHTML='';
  bar.style.background=fails?'color-mix(in srgb, var(--critical) 12%, var(--surface))':'color-mix(in srgb, var(--warning) 14%, var(--surface))';
  const det=el('details',{},
    el('summary',{style:'cursor:pointer;font-weight:600;color:'+(fails?'var(--critical)':'var(--ink)')},
      (fails?`⚠ ${fails} problem(s) need attention`:`${probs.length} notice(s)`)+' — click for details and fixes'),
    ...probs.map(c=>el('div',{style:'margin:.3rem 0 0 .5rem'},
      el('span',{class:'badge',style:'background:'+(c.level==='fail'?'var(--critical)':'var(--warning)')},c.level),
      ' ',el('b',{},c.name),' — ',c.detail,
      c.fix?el('div',{class:'muted',style:'margin-left:2.6rem'},'fix: '+c.fix):'')));
  bar.append(det);
}
refreshDoctor();
setInterval(refreshDoctor,60000);

// deep link: #msg=<id> opens the full message view directly
if(location.hash.startsWith('#msg=')){
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='messages'));
  renderMessageView(decodeURIComponent(location.hash.slice(5)));
} else {
  renderDash();
}
