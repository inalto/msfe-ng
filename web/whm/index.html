    row('Apply to (pct=)',pct,'% of failing mail the policy applies to. Below 100 only while ramping up quarantine or reject.'),
    row('Reports to (rua=)',rua,'Aggregate reports, daily, from every large receiver — the only way to see who sends as the domain. Another domain needs an authorization record there.'),
    row('Failure reports (ruf=)',ruf,'Per-message forensic reports; few receivers send them. Leave empty unless you have a tool that reads them.'),
    row('DKIM alignment',adkim,'Relaxed accepts a subdomain of the From domain in the signature; strict wants the exact domain.'),

const ACD_KIND={addon:'addon',parked:'parked',sub:'sub'};
const acdAge=s=>{s=Math.max(0,+s||0);return s<90?'just now':s<5400?Math.round(s/60)+' min ago':s<172800?Math.round(s/3600)+' h ago':Math.round(s/86400)+' days ago';};
// Where the zone that holds this name lives, in one short phrase.
function acdDns(z){

  // The daemon flattens the domain fields onto the row; the view keeps them under `domain`.

  // ---- list: order, filter, chips --------------------------------------------
  const lvl=r=>{const k=ACD_ORDER[r&&r.level];return k===undefined?ACD_ORDER.unknown:k;};

  function matches(r){

      :(scan?'No domain was found on this server.':'Nothing scanned yet — press Scan.');

  // ---- repair ----------------------------------------------------------------
  async function acdFix(domain,what,record){
    const body={domain,what};
    if(record)body.record=record;
    return await api('/api/acctdns/fix',{method:'POST',body});
  }
  function acdRepair(n,only){
    const r=n.row,d=(r.domain||{}).domain||'',dns=acdDns(r.zone);
    const m=modal('Repair '+d);
    m.body.append(el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.5rem'},
      'Each selected change runs one of cPanel’s own installers for '+d+'. DNS: '+dns.label+' — '+dns.title+'.'));

    ACD_CHECKS.forEach(([k,label])=>{

        out.textContent+='# '+p.label+'\n';
        const res=await acdFix(d,p.k,p.k==='dkim'?null:(p.value()||null));
        out.textContent+=(((res&&res.actions)||[]).join('\n')||(res&&res.error)||'no output')+'\n\n';
        if(res&&res.ok){if(res.row){n.row=acdNorm(res.row);fillRow(n);order();draw();if(n.open)drawDetail(n);}}
        else bad++;
      }
      go.disabled=false;
      toast(bad?bad+' change(s) failed — see the transcript':'Repaired — rescan later if a resolver still shows the old record');
    };
    m.body.append(el('div',{class:'ctl',style:'margin-top:.6rem'},go,close),out);
  }

  // ---- scan: start, poll, render ---------------------------------------------
  function applyScan(s){
    if(!s)return;
    if(s.supported===false){unsupported(s.panel);return;}
    scan=s;
    (s.rows||[]).forEach(r=>upsert(r));
    order();draw();
    const n=(s.rows||[]).length,total=+s.total||0;
    if(s.done===false){
      scanBtn.disabled=true;scanBtn.textContent='Scanning… '+n+'/'+(total||'?');
      stamp.textContent=total?'scanning '+total+' domains':'scanning…';
    }else{
      scanBtn.disabled=false;scanBtn.textContent='Scan';
      stamp.textContent='last scan '+(s.finished?fmtTime(s.finished):'—')+
        (s.age_secs===undefined||s.age_secs===null?'':' ('+acdAge(s.age_secs)+')')+
        ' · '+n+' domain'+(n===1?'':'s');
    }
    errs.innerHTML='';
    if((s.errors||[]).length)errs.append(el('div',{class:'note warn',style:'font-size:.78rem'},(s.errors||[]).join(' · ')));
  }
  async function poll(){
    const s=await api('/api/acctdns/scan');
    if(!s||s.error){
      clearInterval(dlvAcctTimer);dlvAcctTimer=null;
      scanBtn.disabled=false;scanBtn.textContent='Scan';
      stamp.textContent=(s&&s.error)||'lost the scan';
      return;
    }
    applyScan(s);
    if(s.done!==false){clearInterval(dlvAcctTimer);dlvAcctTimer=null;}
  }
  scanBtn.onclick=async()=>{
    scanBtn.disabled=true;scanBtn.textContent='Starting…';
    const r=await api('/api/acctdns/scan',{method:'POST',body:{}});
    if(!r||(r.error&&!r.id)){
      scanBtn.disabled=false;scanBtn.textContent='Scan';
      if(r&&r.supported===false)unsupported(r.panel);else toast((r&&r.error)||'cannot start the scan');
      return;
    }
    if(r.running)toast('A scan is already running — following it');
    stamp.textContent='scanning…';
    clearInterval(dlvAcctTimer);poll();dlvAcctTimer=setInterval(poll,1500);
  };
  filter.oninput=draw;onlyBad.onchange=draw;hideSub.onchange=draw;

  // First render: the last scan at once (with its age), or the never-scanned
  // state. A 404 (nothing has ever run) arrives as {error}.
  const first=await api('/api/acctdns/scan');
  if(!first||first.error){
    stamp.textContent='never scanned — press Scan to check every domain';
    draw();
  }else{
    applyScan(first);
    if(first.supported!==false&&first.done===false){clearInterval(dlvAcctTimer);dlvAcctTimer=setInterval(poll,1500);}
  }
}

// ---- Config: the whole MailScanner etc tree ---------------------------------
// One catalog of files (GET /api/conf/tree), one editor per kind, every save
// through PUT /api/conf/file → validate on a staged copy → backup → apply →
// restart/reload. Ids are the server's; the browser never names a path.
const KIND_LABEL={keyvalue:'settings',toml:'settings','rules':'ruleset','filename-rules':'file rules','spam-lists':'RBL list','virus-scanners':'scanners','host-list':'hosts',text:'text',readonly:'locked'};
const RELOAD_LABEL={restart:'restart on save',reload:'reload on save',none:'no reload'};
const RELOAD_HINT={restart:'MailScanner reads this file only at start: saving restarts it (scanning pauses for a few seconds; mail queues meanwhile).',reload:'MailScanner re-reads this file for every batch: saving reloads it without a restart.',none:'MailScanner does not read this file; saving needs no reload.'};
const fmtTime=t=>t?new Date(t*1000).toLocaleString():'';

// Line diff without a library: strip the common head and tail, LCS over the
// middle (bounded — beyond that the middle is shown as replaced).
function lineDiff(a,b){
  const A=a.split('\n'),B=b.split('\n');
  let s=0;while(s<A.length&&s<B.length&&A[s]===B[s])s++;
  let e=0;while(e<A.length-s&&e<B.length-s&&A[A.length-1-e]===B[B.length-1-e])e++;
  const X=A.slice(s,A.length-e),Y=B.slice(s,B.length-e);
  const out=[];
  for(let i=0;i<s;i++)out.push({t:' ',s:A[i]});
  if(X.length*Y.length>1500*1500){X.forEach(l=>out.push({t:'-',s:l}));Y.forEach(l=>out.push({t:'+',s:l}));}
  else{
    const n=X.length,m=Y.length,L=new Uint16Array((n+1)*(m+1));
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*(m+1)+j]=X[i]===Y[j]?L[(i+1)*(m+1)+j+1]+1:Math.max(L[(i+1)*(m+1)+j],L[i*(m+1)+j+1]);
    let i=0,j=0;
    while(i<n&&j<m){
      if(X[i]===Y[j]){out.push({t:' ',s:X[i]});i++;j++;}
      else if(L[(i+1)*(m+1)+j]>=L[i*(m+1)+j+1]){out.push({t:'-',s:X[i]});i++;}
      else{out.push({t:'+',s:Y[j]});j++;}
    }
    while(i<n){out.push({t:'-',s:X[i++]});}
    while(j<m){out.push({t:'+',s:Y[j++]});}
  }
  for(let i=A.length-e;i<A.length;i++)out.push({t:' ',s:A[i]});
  return out;
}
// Render a diff with a little context around each change.
function renderDiff(ops,ctx=3){
  const pre=el('pre',{class:'log diff'});
  const keep=new Set();
  ops.forEach((o,i)=>{if(o.t!==' ')for(let k=Math.max(0,i-ctx);k<=Math.min(ops.length-1,i+ctx);k++)keep.add(k);});
  if(!keep.size){pre.textContent='No differences.';return pre;}
  let gap=false;
  ops.forEach((o,i)=>{
    if(!keep.has(i)){gap=true;return;}
    if(gap){pre.append(el('span',{class:'gap'},'⋯\n'));gap=false;}
    pre.append(el('span',{class:o.t==='+'?'add':o.t==='-'?'del':''},(o.t==='+'?'+ ':o.t==='-'?'− ':'  ')+o.s+'\n'));
  });
  return pre;
}

// Key/value editor: entries as fields, comments shown and preserved; the save

// Table editor for the row-shaped files. Rows remember the line they came

const TABLE_SPECS={
  'rules':{cols:[{f:'direction',label:'Direction',type:'select',options:['To:','From:','FromOrTo:','FromAndTo:']},{f:'pattern',label:'Pattern',mono:true,ph:'*@domain.example'},{f:'and_direction',label:'and',type:'select',options:['','To:','From:','FromOrTo:','FromAndTo:']},{f:'and_pattern',label:'and-pattern',mono:true,ph:'(pattern)'},{f:'value',label:'Value',ph:'yes / no / deliver …'}],blank:{direction:'To:'},hint:'First match wins. Patterns are single tokens (*@domain, user@domain, default); the value is what the directive expects.'},
  'filename-rules':{cols:[{f:'action',label:'Action',type:'select',options:['allow','deny','deny+delete','rename'],free:true},{f:'pattern',label:'Pattern (perl regex)',mono:true,ph:'\\.exe$'},{f:'log_text',label:'Log text',ph:'Windows executable'},{f:'user_text',label:'Text shown to the user',ph:'Executables are not allowed'}],blank:{action:'deny'},hint:'Checked top to bottom; the first matching pattern decides. "rename" keeps the file with a safe name; "rename to .txt" also changes the extension.'},
  'spam-lists':{cols:[{f:'name',label:'Name',mono:true,ph:'SPAMHAUS-ZEN'},{f:'domain',label:'DNS zone',mono:true,ph:'zen.spamhaus.org.'}],blank:{},hint:'Names are what "Spam List" in MailScanner.conf refers to.'},

  'host-list':{cols:[{f:'host',label:'Hostname',mono:true,ph:'phish.example'}],blank:{},hint:'One hostname per line; *.example covers subdomains. Paste several at once into a new row.'},

function tableEditor(d){
  const spec=TABLE_SPECS[d.kind];

  if(spec.hint)root.append(el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.4rem'},spec.hint));
  if(d.parsed&&d.parsed.normalized)root.append(el('div',{class:'note warn'},'Some lines use spaces where MailScanner expects tabs — saving rewrites them in the canonical form.'));
  const table=el('table');root.append(table);
  const ROWS=(d.parsed&&d.parsed.rows)||[];
  const UN=(d.parsed&&d.parsed.unparsed)||[];
  let dirty=false;
  function rowFor(r){
    const tr=el('tr',{class:'crow'});if(r.line)tr.dataset.line=r.line;
    spec.cols.forEach(c=>{
      let inp;
      const val=r[c.f]==null?'':String(r[c.f]);
      if(c.type==='select'&&!(c.free&&val&&!c.options.includes(val))){
        inp=el('select',{'data-f':c.f});
        c.options.forEach(o=>inp.append(el('option',{value:o,...(o===val?{selected:'selected'}:{})},o||'—')));
        if(c.free)inp.append(el('option',{value:'rename to .txt'},'rename to .txt'));

        if(c.mono)inp.classList.add('mono');
      }
      inp.oninput=()=>{dirty=true;};inp.onchange=()=>{dirty=true;};
      tr.append(el('td',{},inp));
    });
    tr.append(el('td',{},Object.assign(el('button',{class:'act plain',title:'Remove'},'✕'),{onclick:()=>{tr.remove();dirty=true;}})));

  }

    ROWS.forEach(r=>table.append(rowFor(r)));
    UN.forEach(u=>table.append(el('tr',{class:'unparsed'},el('td',{colspan:String(spec.cols.length+1)},
      el('span',{class:'badge',style:'background:var(--critical);margin-right:.5rem'},'line '+u.line),
      el('span',{class:'mono muted'},u.text),
      el('span',{class:'muted',style:'margin-left:.5rem;font-size:.75rem'},'— not understood; kept as is (fix it in Raw mode)')))));
  }
  draw();
  const add=el('button',{class:'act plain'},'+ Add row');
  add.onclick=()=>{const tr=rowFor(spec.blank);table.append(tr);dirty=true;const f=tr.querySelector('input');if(f)f.focus();};
  root.append(el('div',{class:'ctl',style:'margin-top:.5rem'},add));

    const t=(e.clipboardData||window.clipboardData).getData('text');

    if(hosts.length<2)return;

    dirty=true;
  });
  return {root,focusLine(n){
    const tr=table.querySelector(`tr[data-line="${n}"]`)||[...table.querySelectorAll('tr.unparsed')].find(r=>r.textContent.includes('line '+n));
    if(!tr)return;tr.scrollIntoView({block:'center'});tr.classList.add('flash');setTimeout(()=>tr.classList.remove('flash'),1600);const f=tr.querySelector('input,select');if(f)f.focus();
  },body(){
    if(!dirty)return null;
    const rows=[...table.querySelectorAll('tr.crow')].map(tr=>{
      const o={};if(tr.dataset.line)o.line=+tr.dataset.line;
      spec.cols.forEach(c=>{o[c.f]=tr.querySelector(`[data-f="${c.f}"]`).value.trim();});

  },describe(){const b=this.body();return b?`${b.rows.length} row(s)`:'';}};
}

function renderSaveReport(r){

    const head=el('div',{class:'note '+(v.ok?'ok':v.timed_out?'warn':'bad')},
      el('b',{},v.tool+': '),v.ok?'no problems found':v.timed_out?'did not finish (inconclusive — the file was kept)':'problems found');
    box.append(head);
    if(v.problems&&v.problems.length)box.append(el('ul',{class:'problems'},...v.problems.map(p=>el('li',{},p))));
    if(v.output){const det=el('details',{},el('summary',{class:'muted'},'transcript'),el('pre',{class:'log'},v.output));box.append(det);}
  }

    box.append(el('div',{class:'note '+(r.reloaded.ok?'ok':'bad')},el('b',{},'MailScanner '+r.reloaded.action+': '),r.reloaded.ok?'done':'failed — see the Service tab'));
    if(r.reloaded.transcript&&r.reloaded.transcript.length&&!r.reloaded.ok)box.append(el('pre',{class:'log'},r.reloaded.transcript.join('\n')));
  } else if(r.reloaded&&r.reloaded.transcript&&r.reloaded.transcript.length){
    box.append(el('div',{class:'muted',style:'font-size:.8rem'},r.reloaded.transcript.join(' ')));
  }
  if(r.backup_id)box.append(el('div',{class:'muted',style:'font-size:.78rem'},'Previous version kept in history as '+r.backup_id));

}

async function renderConfig(){

  const tree=el('aside',{class:'tree'});

  wrap.append(tree,ed);v.append(bar,pendingNote,testCard,wrap);

  // ---- tester ---------------------------------------------------------------
  const testBtn=el('button',{class:'act',title:'MailScanner --lint, spamassassin --lint and MSFE-NG\'s cross-file checks over the configuration on disk'},'Test configuration');
  const testNote=el('span',{class:'muted',style:'font-size:.78rem'});
  bar.append(testBtn,testNote);
  async function openFinding(id,key,line){

    if(key&&editor&&editor.focusKey)editor.focusKey(key);

    ed.scrollIntoView({block:'start',behavior:'smooth'});
  }
  function showTest(r){

    const s=r.summary||{};
    testSummary.textContent=`Configuration test — ${s.fail?s.fail+' problem(s)':'no problems'}${s.warn?', '+s.warn+' warning(s)':''}`;
    testSummary.classList.toggle('bad',!!s.fail);testSummary.classList.toggle('warnish',!s.fail&&!!s.warn);

  async function runTest(edits){

  }
  testBtn.onclick=()=>runTest([]);

  // ---- snapshots ------------------------------------------------------------
  const b64ToBlob=(b64,type)=>{const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type});};

  const impBtn=el('button',{class:'act plain',title:'Compare a snapshot with this server and import chosen files'},'Import snapshot');
  bar.append(el('span',{style:'flex:1'}),expBtn,impBtn);
  expBtn.onclick=async()=>{
    if(!confirm('Export a snapshot of the MailScanner configuration and /etc/msfe-ng?\n\nIt contains config.toml with the database password — keep the file private. A copy stays in the backups dir on the server.'))return;

    expBtn.disabled=false;
    if(!r||!r.ok){toast((r&&r.error)||'export failed');return;}
    const url=URL.createObjectURL(b64ToBlob(r.b64,'application/gzip'));
    const a=el('a',{href:url,download:r.name});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast(`Snapshot: ${r.files} files, ${fmtSize(r.size)} — also kept at ${r.path}`);
  };
  impBtn.onclick=()=>importWizard();
  async function importWizard(){
    const m=modal('Import a snapshot');

  mcon.append(mtitle,mpre);
  const mres=el('div',{style:'margin-top:.5rem'});
  mc.append(el('div',{class:'ctl'},msel,mfile,moff,mrun,mself),mcon,mres);
  function followCfgJob(name,label,onDone){
    clearInterval(cfgJobTimer);mcon.style.display='';mtitle.textContent=label+' — running…';mpre.textContent='';
    const tick=async()=>{
      let s;try{s=await api('/api/jobs/'+name);}catch(e){s=null;}
      if(!s||s.error)return;
      mpre.textContent=s.log||'(no output yet)';mpre.scrollTop=mpre.scrollHeight;
      if(s.running)return;
      clearInterval(cfgJobTimer);cfgJobTimer=null;
      mtitle.textContent=label+(s.exit===0?' — finished':' — '+(s.exit==null?'interrupted':'failed (exit '+s.exit+') — full log: '+s.log_path));
      onDone&&onDone(s.exit===0);
    };
    tick();cfgJobTimer=setInterval(tick,2000);
  }
  function renderMsgResult(r){
    const box=el('div',{class:'msgres'});
    const sa=r.spamassassin||{},av=r.virus||{},pr=r.predicted||{};
    const row=(lvl,label,text)=>el('div',{class:'note '+lvl},el('b',{},label+': '),text);
    box.append(el('div',{class:'muted',style:'font-size:.78rem'},'Sample: '+(r.sample||'')+' — simulation, not a real delivery'));
    box.append(row(!sa.ran?'warn':sa.spam===true?'bad':sa.spam===false?'ok':'warn','SpamAssassin',
      !sa.ran?(sa.note||'did not run'):sa.spam==null?(sa.note||'no verdict'):`${sa.spam?'spam':'not spam'} — score ${sa.score} (required ${sa.required})${sa.tests&&sa.tests.length?' · tests: '+sa.tests.join(', '):''}${sa.note?' · '+sa.note:''}`));
    box.append(row(!av.ran||av.infected==null?'warn':av.infected?'bad':'ok','Virus',
      !av.ran?(av.note||'no scanner found'):av.infected==null?(av.note||'no verdict'):av.infected?`infected — ${av.signature} (${av.tool})`:`clean (${av.tool})`));
    const cs=r.content||[];
    box.append(row(cs.some(c=>/^deny/.test(c.action))?'bad':cs.length?'warn':'ok','Content rules',
      cs.length?cs.map(c=>`${c.filename}: ${c.action} by ${String(c.rule_file).replace(/^ms:/,'')} (${c.pattern} — ${c.log_text})`).join(' · '):'no filename/filetype rule matched'));
    box.append(row('','Predicted outcome',`${pr.from||'?'} → ${pr.to||'?'}: ${pr.outcome||''}`));
    const res=Object.entries(pr.resolved||{});
    if(res.length)box.append(el('div',{class:'muted',style:'font-size:.78rem'},'Resolved for this sender/recipient: '+res.map(([k,v])=>`${k} = ${v||'(empty)'}`).join(' · ')));
    if(r.transcript&&r.transcript.length)box.append(el('details',{},el('summary',{class:'muted',style:'cursor:pointer'},'transcript'),el('pre',{class:'log'},r.transcript.join('\n'))));
    return box;
  }
  mrun.onclick=async()=>{
    const body={sample:msel.value,online:!moffBox.checked};
    if(msel.value==='upload'){
      const f=mfile.files&&mfile.files[0];if(!f){toast('Choose a .eml file first');return;}
      if(f.size>2900000){toast('The message must be under 2.9 MB');return;}
      body.eml_b64=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',').pop());rd.onerror=rej;rd.readAsDataURL(f);});
    }
    mrun.disabled=true;mres.innerHTML='';
    const r=await api('/api/jobs/conf-test-message',{method:'POST',body});
    mrun.disabled=false;
    if(!r||!r.ok){toast((r&&r.error)||'cannot start');return;}
    followCfgJob('conf-test-message','Simulation',async()=>{const d=await api('/api/conf/test/message/last');mres.innerHTML='';if(d&&d.known)mres.append(renderMsgResult(d));else mres.append(el('div',{class:'note bad'},'No result was written — see the log above'));});
  };
  mself.onclick=async()=>{
    if(!confirm('Send three real test messages (clean, GTUBE spam, EICAR virus) from msfe-ng-selftest@localhost to root@localhost through the MTA on 127.0.0.1:25?\n\nThey are scanned like any other mail; find them on the Messages tab in a minute (subject "MSFE-NG selftest").'))return;
    const r=await api('/api/jobs/selftest',{method:'POST'});
    if(!r||!r.ok){toast((r&&r.error)||'cannot start');return;}
    followCfgJob('selftest','Real test mail',ok=>{mres.innerHTML='';mres.append(el('div',{class:'note '+(ok?'ok':'bad')},ok?'Sent — the Messages tab shows the real verdicts once MailScanner has scanned them.':'Sending failed — is the MTA listening on 127.0.0.1:25? See the log above.'));});
  };
  api('/api/conf/test/message/last').then(d=>{if(d&&d.known)mres.append(renderMsgResult(d));});
  // Spam checks — force MailScanner to scan mail for every domain
  const sc=el('div',{class:'card'},el('h2',{},'Spam checks'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Sets MailScanner’s global “Spam Checks = yes”, so SpamAssassin runs on mail for every domain (this is the authoritative switch — it overrides any per-domain rule). MailScanner is restarted to apply the change.'));
  maint.append(sc);
  const scout=el('pre',{class:'log',style:'display:none'},'');
  const scbtn=el('button',{class:'act'},'Enable spam checks for all domains');
  scbtn.onclick=async()=>{
    if(!confirm('Set MailScanner “Spam Checks = yes” for all domains and restart MailScanner to apply?'))return;
    scbtn.disabled=true;scout.style.display='';scout.textContent='Applying…';
    const r=await api('/api/engine/spam-checks-all',{method:'POST'});
    scbtn.disabled=false;
    scout.textContent=((r&&r.transcript)||[(r&&r.error)||'no response']).join('\n');
    toast(r&&r.ok?'Spam checks on for all domains':'Failed — see output');
  };
  sc.append(el('div',{class:'ctl'},scbtn),scout);

  // Database & Bayes maintenance (POSTs to /api/db/*)
  const dc=el('div',{class:'card'},el('h2',{},'Database & Bayes maintenance'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Backups are timestamped SQL dumps in backup_dir ('+esc(PREFS.backup_dir||'/opt/msfe-ng/backups')+'). '+
      '"Fix common problems" applies pending migrations, then optimizes and analyzes the MSFE-NG tables. '+
      'Bayes repair expires old tokens; recreate wipes all training (a database backup is taken first).'));
  maint.append(dc);
  const dout=el('pre',{class:'log'},'Choose an action.');
  async function dbAction(path,label,confirmMsg,btn){
    if(confirmMsg&&!confirm(confirmMsg))return;
    btn.disabled=true;dout.textContent=label+'…';
    const rr=await api('/api/db/'+path,{method:'POST'});
    btn.disabled=false;
    if(!rr||rr.error){dout.textContent='ERROR: '+((rr&&rr.error)||'request failed');toast('Failed');return;}
    if(rr.path){dout.textContent='Wrote '+rr.path;toast('Backup written');}
    else if(rr.log){dout.textContent=(rr.log||[]).join('\n');toast(rr.ok?'Done':'Completed with errors');}
    else if(rr.transcript){dout.textContent=(rr.transcript||[]).join('\n');toast(rr.ok?'Done':'Failed');}
    else{dout.textContent=JSON.stringify(rr);toast(rr.ok?'Done':'Failed');}
  }
  // Queue auto-clean: per-rule thresholds, dry-run preview, last-run summary
  const cc=el('div',{class:'card'},el('h2',{},'Queue auto-clean'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Every 5 minutes, messages in the DELIVERY queue matching an enabled rule are removed automatically. 0 disables a rule — everything ships off. The scanning queue is never touched, so unscanned mail cannot be deleted. Note: mail scanned only by MailScanner may carry no spool spam score, so the score rule matches mail scored by the cPanel SpamAssassin ACL.'));
  maint.append(cc);
  const cconf=await api('/api/config');
  const cgrid=el('div',{class:'grid2'});
  const CLEAN_FIELDS=[
    ['queue_clean_frozen_hours','Remove frozen messages older than (hours, 0=off)'],
    ['queue_clean_bounce_hours','Remove bounces (null sender ∅) older than (hours, 0=off)'],
    ['queue_clean_spam_score','Remove messages with spam score ≥ (0=off)'],
  ];
  CLEAN_FIELDS.forEach(([k,lbl])=>{
    const inp=el('input',{type:'number',min:'0',step:k==='queue_clean_spam_score'?'0.1':'1',value:String(cconf[k]??0)});
    inp.dataset.ckey=k;
    cgrid.append(el('label',{class:'field'},lbl,inp));
  });
  const cleanOut=el('pre',{class:'log',style:'display:none'},'');
  const lastInfo=el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.5rem'});
  api('/api/service/queue').then(q=>{
    if(q&&q.clean_last&&q.clean_last.at)
      lastInfo.textContent=`Last automatic clean: removed ${q.clean_last.removed} message(s) at ${new Date(q.clean_last.at*1000).toLocaleString()}`;
  });
  function cleanBody(dry){
    const b={dry};
    cgrid.querySelectorAll('[data-ckey]').forEach(i=>{
      b[{queue_clean_frozen_hours:'frozen_hours',queue_clean_bounce_hours:'bounce_hours',queue_clean_spam_score:'spam_score'}[i.dataset.ckey]]=+i.value||0;
    });
    return b;
  }
  const cPrev=el('button',{class:'act plain'},'Preview (dry-run)');
  cPrev.onclick=async()=>{
    cPrev.disabled=true;cleanOut.style.display='';cleanOut.textContent='Checking the delivery queue…';
    const r=await api('/api/service/queue/clean',{method:'POST',body:cleanBody(true)});
    cPrev.disabled=false;
    cleanOut.textContent=(r.transcript||[r.error||'no response']).join('\n');
  };
  const cRun=el('button',{class:'act danger'},'Clean now');
  cRun.onclick=async()=>{
    if(!confirm('Remove all delivery-queue messages matching the thresholds above?\n\nThey are deleted permanently. Use Preview first to see what matches.'))return;
    cRun.disabled=true;cleanOut.style.display='';cleanOut.textContent='Cleaning…';
    const r=await api('/api/service/queue/clean',{method:'POST',body:cleanBody(false)});
    cRun.disabled=false;
    cleanOut.textContent=(r.transcript||[r.error||'no response']).join('\n');
    toast(r&&r.ok?`Removed ${r.count} message(s)`:'Clean failed — see output');
  };
  const cSave=el('button',{class:'act'},'Save rules');
  cSave.onclick=async()=>{
    const changes={};
    cgrid.querySelectorAll('[data-ckey]').forEach(i=>{changes[i.dataset.ckey]=String(+i.value||0);});
    const r=await api('/api/service/conf/apply',{method:'POST',body:{which:'msfe',changes}});
    toast(r&&r.ok?'Rules saved — the 5-minute monitor applies them automatically':'Save failed');
  };
  cc.append(lastInfo,cgrid,el('div',{class:'ctl'},cSave,cPrev,cRun),cleanOut);

  // Auto-ban of spam sources in csf: thresholds per severity, match rules,
  // dry run, history. Thresholds are config keys (conf/apply); the match
  // rules go through /api/autoban/rules (validated by the engine's perl).
  const ab=el('div',{class:'card'},el('h2',{},'Auto-ban spam sources (csf)'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Every minute, the sources of newly logged spam are banned temporarily in csf (csf -td) when a rule below fires. Count 1 bans on the first message. Never banned: your own and private addresses, anything in csf.allow, an IP already denied, and an IP that also delivered clean mail in the same window (a shared provider with one false positive). Match rules also block delivery: a blocking rule scores 100, so the message follows the domain\u2019s high-spam action and is never delivered.'));
  maint.append(ab);
  renderAutobanCard(ab,cconf);

  // Telegram alerts: bot credentials + thresholds + test button
  const tc=el('div',{class:'card'},el('h2',{},'Telegram alerts'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Get a Telegram message when the delivery queue grows, the scanning queue is stuck, or one account suddenly sends a lot of mail (the alert names the account). Create a bot with @BotFather to get a token; the chat id is your own id or a group id. 0 disables a threshold.'));
  maint.append(tc);
  const tgrid=el('div',{class:'grid2'});
  const tok=el('input',{type:'password',placeholder:cconf.telegram_configured?'(configured — leave empty to keep)':'123456:ABC-DEF…','autocomplete':'off'});
  tok.dataset.tkey='telegram_bot_token';
  const TG_FIELDS=[
    ['telegram_chat_id','Chat id','text'],
    ['alert_queue_size','Alert when delivery queue reaches (messages, 0=off)','number'],
    ['alert_scan_stuck_mins','Alert when scanning queue is stuck for (minutes, 0=off)','number'],
    ['alert_burst_per_hour','Alert when one account sends (messages/hour, 0=off)','number'],
    ['alert_cooldown_mins','Repeat the same alert at most every (minutes)','number'],
  ];
  tgrid.append(el('label',{class:'field'},'Bot token'+(cconf.telegram_configured?' (set)':''),tok));
  TG_FIELDS.forEach(([k,lbl,type])=>{
    const inp=el('input',{type,value:String(cconf[k]??'')});
    if(type==='number'){inp.setAttribute('min','0');}
    inp.dataset.tkey=k;
    tgrid.append(el('label',{class:'field'},lbl,inp));
  });
  const tgOut=el('pre',{class:'log',style:'display:none'},'');
  const tSave=el('button',{class:'act'},'Save alert settings');
  tSave.onclick=async()=>{
    const changes={};
    tgrid.querySelectorAll('[data-tkey]').forEach(i=>{
      if(i.dataset.tkey==='telegram_bot_token'&&!i.value.trim())return; // empty = keep existing
      changes[i.dataset.tkey]=i.value.trim();
    });
    const r=await api('/api/service/conf/apply',{method:'POST',body:{which:'msfe',changes}});
    toast(r&&r.ok?`${r.applied} setting(s) saved`:'Save failed');
  };
  const tTest=el('button',{class:'act plain'},'Send test message');
  tTest.onclick=async()=>{
    tTest.disabled=true;tgOut.style.display='';tgOut.textContent='Sending test message…';
    const r=await api('/api/telegram/test',{method:'POST'});
    tTest.disabled=false;
    tgOut.textContent=(r.transcript||[r.error||'no response']).join('\n');
    toast(r&&r.ok?'Test message sent':'Test failed — see output');
  };
  tc.append(tgrid,el('div',{class:'ctl'},tSave,tTest),tgOut);

  const dbtns=el('div',{class:'ctl',style:'flex-wrap:wrap'});
  const bBackup=el('button',{class:'act'},'Backup now');
  bBackup.onclick=()=>dbAction('backup','Dumping database',null,bBackup);
  const bFix=el('button',{class:'act plain'},'Fix common problems');
  bFix.onclick=()=>dbAction('fix','Applying migrations & optimizing','Apply any pending migrations and run OPTIMIZE/ANALYZE on the MSFE-NG tables?',bFix);
  const bRepair=el('button',{class:'act plain'},'Bayes repair');
  bRepair.onclick=()=>dbAction('bayes-repair','Expiring old Bayes tokens',null,bRepair);
  const bReset=el('button',{class:'act danger'},'Bayes recreate');
  bReset.onclick=()=>dbAction('bayes-reset','Wiping Bayes','Wipe the entire SpamAssassin Bayes database?\n\nAll ham/spam training is discarded and Bayes retrains from scratch. A database backup is taken first.',bReset);
  dbtns.append(bBackup,bFix,bRepair,bReset);
  dc.append(dbtns,dout);

}

// Doctor banner: shown on every tab whenever any chain link is unhealthy.
// Rail health dot mirrors the doctor summary — the "instrument" at a glance.
function setRailHealth(color,text){
  const h=$('#railhealth');if(!h)return;
  h.innerHTML='';
  h.append(el('span',{class:'dot',style:`width:8px;height:8px;border-radius:50%;background:${color}`}),el('span',{},text));
}
async function refreshDoctor(){
  const bar=$('#doctorbar');
  const d=await api('/api/doctor');
  const checks=d.checks||[];
  const probs=checks.filter(c=>c.level!=='ok');
  const fails=probs.filter(c=>c.level==='fail').length;
  if(!checks.length) setRailHealth('var(--muted)','status unknown');
  else if(fails) setRailHealth('var(--critical)',`${fails} problem${fails>1?'s':''}`);
  else if(probs.length) setRailHealth('var(--warning)',`${probs.length} notice${probs.length>1?'s':''}`);
  else setRailHealth('var(--good)','all systems ok');
  if(!probs.length){bar.style.display='none';return;}
  bar.style.display='';bar.innerHTML='';
  bar.style.background=fails?'color-mix(in srgb, var(--critical) 12%, var(--surface))':'color-mix(in srgb, var(--warning) 14%, var(--surface))';
  const det=el('details',{},
    el('summary',{style:'cursor:pointer;font-weight:600;color:'+(fails?'var(--critical)':'var(--ink)')},
      (fails?`⚠ ${fails} problem(s) need attention`:`${probs.length} notice(s)`)+' — click for details and fixes'),
    ...probs.map(c=>el('div',{style:'margin:.3rem 0 0 .5rem'},
      el('span',{class:'badge',style:'background:'+(c.level==='fail'?'var(--critical)':'var(--warning)')},c.level),
      ' ',el('b',{},c.name),' — ',c.detail,
      c.fix?el('div',{class:'muted',style:'margin-left:2.6rem'},'fix: '+c.fix,c.url?el('span',{},' — ',el('a',{href:c.url,target:'_blank',rel:'noopener'},'procedure')):''):'',
      c.proposal?el('div',{style:'margin:.25rem 0 0 2.6rem'},Object.assign(el('button',{class:'act plain'},'Apply: '+c.proposal),{onclick:async e=>{
        if(!confirm(`${c.name}\n\n${c.detail}\n\nApply this change?\n${c.proposal}\n\nMailScanner files are validated before going live and the previous version is kept.`))return;
        e.target.disabled=true;e.target.textContent='Applying…';
        const r=await api('/api/doctor/apply',{method:'POST',body:{name:c.name}});
        if(r&&r.ok){toast('Applied — '+(r.lines||[]).slice(-1)[0]);alert((r.lines||[]).join('\n'));}
        else{toast('Not applied');alert((r&&r.error)||'failed');e.target.disabled=false;e.target.textContent='Apply: '+c.proposal;}
        refreshDoctor();
      }})):'')));
  // the mechanical repairs (perl modules, engine configure, phishing lists,
  // rules, spool, start) in one go; decisions stay listed with their fix
  const fixBtn=el('button',{class:'act plain',style:'margin:.4rem 0 0 .5rem'},'Fix what can be fixed');
  fixBtn.onclick=async()=>{
    fixBtn.disabled=true;fixBtn.textContent='Fixing…';
    const r=await api('/api/doctor/fix',{method:'POST'});
    fixBtn.disabled=false;fixBtn.textContent='Fix what can be fixed';
    if(!r||!r.ok){toast(r&&r.error||'fix failed');return;}
    if(!r.done||!r.done.length)toast('Nothing to fix automatically — the remaining items need a decision (see their fix hints)');
    else alert('Applied:\n\n'+r.done.join('\n'));
    refreshDoctor();
  };
  det.append(fixBtn);
  bar.append(det);
}
refreshDoctor();
setInterval(refreshDoctor,60000);

// deep link: #msg=<id> opens the full message view directly
if(location.hash.startsWith('#msg=')){
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='messages'));
  renderMessageView(decodeURIComponent(location.hash.slice(5)));
} else {
  renderDash();
}
</script>
