<script>
const PANEL="{{PANEL}}";
// Direct = served by the daemon in dev; else proxied through the panel CGI.
const DIRECT = !location.pathname.includes('.cgi') && !location.pathname.includes('CMD_PLUGINS');
async function api(path,{method='GET',body=null,raw=false}={}){
  const opts={method,headers:{}};
  if(body){opts.body=JSON.stringify(body);opts.headers['Content-Type']='application/json';}
  let url=path;
  if(!DIRECT){url=location.pathname.split('?')[0];opts.headers['X-MSFE-Path']=path;}
  const r=await fetch(url,opts);
  if(raw) return r.text();
  try{return await r.json();}catch(e){return {error:'bad response'};}
}
// like api(..,{raw:true}) but tells the caller whether the fetch succeeded, so
// an error body is never rendered as if it were the message
async function apiRaw(path){
  const opts={headers:{}};
  let url=path;
  if(!DIRECT){url=location.pathname.split('?')[0];opts.headers['X-MSFE-Path']=path;}
  const r=await fetch(url,opts);
  return {ok:r.ok,text:await r.text()};
}
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...c)=>{const n=document.createElement(t);for(const k in a){if(k==='html')n.innerHTML=a[k];else n.setAttribute(k,a[k]);}c.flat().forEach(x=>n.append(x));return n;};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
api('/api/config').then(c=>{if(c&&!c.error)PREFS=Object.assign(PREFS,c);});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
// Sync responses: reloaded=false is normal when nothing changed on disk —
// only call it a failure when a change needed a reload that didn't happen.
const rlbl=r=>r.reloaded?'reloaded':(r.changed===0?'no reload needed (unchanged)':'reload failed');

// theme: cycle auto → light → dark, persisted; drives the CSS-variable palette.
(function(){
  const KEY='msfe-theme', label={auto:'◑ Auto',light:'☀ Light',dark:'☾ Dark'};
  const apply=t=>t==='light'||t==='dark'?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme');
  let cur=localStorage.getItem(KEY)||'auto';apply(cur);
  const btn=$('#themebtn');
  if(btn){const sync=()=>{const l=label[cur]||'◑ Theme';const mini=document.querySelector('.app.mini');btn.textContent=mini?l.slice(0,1):l;btn.title=mini?l.slice(2)+' (click to change)':'Toggle light / dark / auto';};sync();
    window.syncTheme=sync;
    btn.onclick=()=>{cur=cur==='auto'?'light':cur==='light'?'dark':'auto';try{localStorage.setItem(KEY,cur);}catch(e){}apply(cur);sync();};}
})();

// rail: full width with labels, or icons only; persisted.
(function(){
  const KEY='msfe-rail',app=$('.app'),btn=$('#railtoggle');
  if(!app||!btn)return;
  const nav=[...document.querySelectorAll('#tabs button')];
  const apply=mini=>{app.classList.toggle('mini',mini);btn.textContent=mini?'»':'«';btn.title=mini?'Expand the sidebar':'Collapse the sidebar';
    nav.forEach(b=>{if(mini)b.title=[...b.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();else b.removeAttribute('title');});
    if(window.syncTheme)window.syncTheme();};
  let mini=false;try{mini=localStorage.getItem(KEY)==='mini';}catch(e){}
  apply(mini);
  btn.onclick=()=>{mini=!mini;try{localStorage.setItem(KEY,mini?'mini':'full');}catch(e){}apply(mini);};
})();

// ---- modal -------------------------------------------------------------------
function modal(title){
  const body=el('div',{});
  const box=el('div',{class:'modal'},
    Object.assign(el('button',{class:'close',title:'Close'},'✕'),{onclick:close}),
    el('h2',{},title),body);
  const bg=el('div',{class:'modal-bg'},box);
  bg.onclick=e=>{if(e.target===bg)close();};
  function close(){bg.remove();document.removeEventListener('keydown',esc);}
  function esc(e){if(e.key==='Escape')close();}
  document.addEventListener('keydown',esc);
  document.body.append(bg);
  return {body,close};
}

// ---- message tools: daily summary, Bayes status, SpamAssassin lint ----------
async function showDailySummary(){
  const m=modal('Daily summary');
  const sel=el('select');[7,14,30,60,90].forEach(d=>sel.append(el('option',{value:d,...(d===14?{selected:'selected'}:{})},d+' days')));
  const holder=el('div',{});
  m.body.append(el('div',{class:'ctl'},el('span',{class:'muted'},'Window:'),sel),holder);
  const fmtB=b=>{b=+b||0;return b>1073741824?(b/1073741824).toFixed(1)+' GB':b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';};
  async function load(){
    holder.innerHTML='';holder.append(el('div',{class:'muted'},'Loading…'));
    const d=await api('/api/stats/daily?days='+sel.value);
    holder.innerHTML='';
    if(!d||!d.available||!(d.items||[]).length){holder.append(el('div',{class:'empty'},'No data for this window.'));return;}
    const t=el('table');
    t.append(el('tr',{},...['Date','Total','Clean','Spam','High spam','Infected','Quarantined','Volume'].map(h=>el('th',{},h))));
    let tot=0;
    d.items.forEach(r=>{tot+=r.total;t.append(el('tr',{},
      el('td',{},r.date),el('td',{class:'num'},r.total),
      el('td',{class:'num',style:'color:var(--good)'},r.clean),
      el('td',{class:'num',style:'color:var(--warning)'},r.spam),
      el('td',{class:'num',style:'color:var(--serious)'},r.highspam),
      el('td',{class:'num',style:'color:var(--critical)'},r.infected),
      el('td',{class:'num'},r.quarantined),el('td',{class:'num'},fmtB(r.bytes))));});
    holder.append(t,el('div',{class:'muted',style:'margin-top:.4rem'},`${tot} messages over ${d.items.length} day(s)`));
  }
  sel.onchange=load;load();
}
async function showBayes(){
  const m=modal('SpamAssassin Bayes database');
  m.body.append(el('div',{class:'muted'},'Loading…'));
  const d=await api('/api/sa/bayes');
  m.body.innerHTML='';
  const t=el('table');
  (d.rows||[]).forEach(r=>t.append(el('tr',{},el('th',{style:'width:16rem'},r.key),el('td',{},r.value))));
  m.body.append(t,el('div',{class:'muted',style:'margin-top:.5rem;font-size:.8rem'},
    'Bayes learns from the messages you train in the message view (Learn as ham / spam). It usually needs a couple of hundred of each before it starts scoring confidently.'));
}
async function showSaLint(){
  const m=modal('SpamAssassin lint test');
  const verdict=el('div',{class:'statline'},el('span',{class:'muted'},'Running spamassassin --lint …'));
  const out=el('pre',{class:'log'});
  m.body.append(verdict,out);
  const r=await api('/api/sa/lint',{method:'POST'});
  verdict.innerHTML='';
  verdict.append(el('span',{style:'font-weight:600;color:'+(r.ok?'var(--good)':'var(--critical)')},
    r.ok?'✅ SpamAssassin configuration is valid':'❌ Problems found — details below'));
  out.textContent=r.output||r.error||'(no output)';
}

// ---- sender: history and white/black listing --------------------------------
function senderLink(addr){
  const a=String(addr||'').trim();
  if(!a||!a.includes('@'))return el('span',{},a);
  return Object.assign(el('a',{class:'iplink',title:'Sender history, blacklist or whitelist'},a),{onclick:e=>{e.stopPropagation();showSender(a);}});
}
async function showSender(addr){
  const m=modal('Sender '+addr);
  m.body.append(el('div',{class:'muted'},'Loading…'));
  const d=await api('/api/sender/info?addr='+encodeURIComponent(addr)+'&days=30');
  m.body.innerHTML='';
  const dom=d.domain||'';
  const stat=(a,label)=>{
    if(!a||!a.available)return el('span',{});
    return el('tr',{},el('th',{style:'width:14rem'},label),
      el('td',{},`${a.total} message(s), ${a.spam} spam / ${a.highspam} high spam / ${a.infected} infected`+
        (a.last_seen?` — last seen ${a.last_seen}`:'')));
  };
  const t=el('table');
  t.append(stat(d.activity,'From this address (30 days)'));
  if(dom)t.append(stat(d.domain_activity,`From the whole domain @${dom}`));
  m.body.append(t);

  const status=el('div',{class:'statline',style:'margin:.6rem 0'});
  function paintStatus(){
    status.innerHTML='';
    const badge=(on,txt,col)=>on?el('span',{class:'badge',style:'background:'+col+';margin-right:.4rem'},txt):el('span',{});
    status.append(
      badge(d.addr_blacklisted,'address blacklisted','var(--ink2)'),
      badge(d.addr_whitelisted,'address whitelisted','var(--good)'),
      badge(d.domain_blacklisted,`@${dom} blacklisted`,'var(--ink2)'),
      badge(d.domain_whitelisted,`@${dom} whitelisted`,'var(--good)'),
      (!d.addr_blacklisted&&!d.addr_whitelisted&&!d.domain_blacklisted&&!d.domain_whitelisted)
        ? el('span',{class:'muted'},'Not on any list.') : el('span',{}));
  }
  paintStatus();
  m.body.append(status);
  const out=el('pre',{class:'log',style:'display:none;max-height:8rem'});

  async function apply(pattern,list,remove){
    const what=remove?`Remove ${pattern} from the ${list}list?`
      :(list==='black'
        ? `Blacklist ${pattern}?\n\nMail matching it is treated as spam${pattern.startsWith('*@')?' — this covers every sender at that domain.':'.'}`
        : `Whitelist ${pattern}?\n\nMail matching it is never marked as spam${pattern.startsWith('*@')?' — this covers every sender at that domain.':'.'}`);
    if(!confirm(what))return;
    out.style.display='';out.textContent='▶ applying…';
    const r=await api('/api/sender/list',{method:'POST',body:{pattern,list,remove}});
    if(r&&r.ok){
      out.textContent=`${remove?'removed from':'added to'} the ${list}list — ${r.files} rule files written, ${rlbl(r)}`;
      toast('Lists updated');
      // reflect the change without a reload
      if(pattern.startsWith('*@')){ if(list==='black')d.domain_blacklisted=!remove; else d.domain_whitelisted=!remove; }
      else { if(list==='black')d.addr_blacklisted=!remove; else d.addr_whitelisted=!remove; }
      paintStatus();
      policy=null;   // Lists/Settings tabs re-fetch
    } else { out.textContent=(r&&r.error)||'failed'; toast('Update failed'); }
  }
  const row=el('div',{class:'ctl',style:'flex-wrap:wrap'});
  row.append(
    Object.assign(el('button',{class:'act'},d.addr_blacklisted?'Remove address from blacklist':'Blacklist this address'),
      {onclick:()=>apply(addr,'black',!!d.addr_blacklisted)}),
    Object.assign(el('button',{class:'act plain'},d.addr_whitelisted?'Remove address from whitelist':'Whitelist this address'),
      {onclick:()=>apply(addr,'white',!!d.addr_whitelisted)}));
  m.body.append(row);
  if(dom){
    const drow=el('div',{class:'ctl',style:'flex-wrap:wrap'});
    drow.append(
      Object.assign(el('button',{class:'act danger'},d.domain_blacklisted?`Remove @${dom} from blacklist`:`Blacklist the whole domain @${dom}`),
        {onclick:()=>apply('*@'+dom,'black',!!d.domain_blacklisted)}),
      Object.assign(el('button',{class:'act plain'},d.domain_whitelisted?`Remove @${dom} from whitelist`:`Whitelist the whole domain @${dom}`),
        {onclick:()=>apply('*@'+dom,'white',!!d.domain_whitelisted)}));
    m.body.append(drow,
      el('div',{class:'muted',style:'font-size:.78rem;margin-top:.4rem'},
        'Lists are global and take effect immediately (rules are regenerated and MailScanner reloaded). Manage them all in the Lists tab.'));
  }
  m.body.append(out);
}

// ---- client IP: activity, reverse DNS, csf status and blocking ---------------
// MailScanner records "[ip]:port" / "ip:port" — show and query the bare address
function bareIp(raw){
  const s=String(raw||'').trim();
  const br=s.match(/^\[([^\]]+)\]/); if(br)return br[1];
  const v4=s.match(/^(\d+\.\d+\.\d+\.\d+):\d+$/); if(v4)return v4[1];
  return s;
}
function ipLink(ip){
  const bare=bareIp(ip);
  if(!bare)return el('span',{});
  return Object.assign(el('a',{class:'iplink',title:'IP details, location, history and firewall actions'},bare),{onclick:()=>showIp(bare)});
}
async function showIp(raw){
  const ip=bareIp(raw);
  const m=modal('Client IP '+ip);
  m.body.append(el('div',{class:'muted'},'Loading…'));
  const d=await api('/api/ip/info?ip='+encodeURIComponent(ip)+'&days=30');
  m.body.innerHTML='';
  const a=d.activity||{};
  const t=el('table');
  const row=(k,v)=>{if(v!=null&&String(v).trim()!=='')t.append(el('tr',{},el('th',{style:'width:12rem'},k),el('td',{},String(v))));};
  row('IP address',d.ip);row('Reverse DNS',d.rdns||'(none)');
  if(a.available){
    row('Messages (last 30 days)',a.total);

// vertical bar chart (single series) as inline SVG
function barChart(data,color){
  const W=Math.max(320,data.length*34),H=180,pad=24,bw=Math.min(26,(W-2*pad)/data.length-6);
  const max=Math.max(1,...data.map(d=>d.value));
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'bars',width:'100%',height:H});
  svg.append(svgEl('line',{class:'axis',x1:pad,y1:H-pad,x2:W-4,y2:H-pad}));
  data.forEach((d,i)=>{
    const x=pad+i*((W-2*pad)/data.length)+3, h=(H-2*pad)*d.value/max, y=H-pad-h;
    const r=svgEl('rect',{x,y,width:bw,height:Math.max(1,h),rx:3,fill:color});
    r.append(svgEl('title',{},`${d.label}: ${d.value}`));svg.append(r);
    if(i%Math.ceil(data.length/8)===0) svg.append(svgEl('text',{x:x+bw/2,y:H-pad+12,'text-anchor':'middle','font-size':9},d.label));
  });
  return svg;
}
// horizontal bars (labeled categories)
function hbars(data){
  const max=Math.max(1,...data.map(d=>d.value));
  const wrap=el('div',{});
  data.forEach(d=>{
    const row=el('div',{style:'display:flex;align-items:center;gap:.5rem;margin:.25rem 0'});
    row.append(el('div',{style:'width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',class:'muted',title:d.label},d.label));
    const track=el('div',{style:'flex:1;background:var(--line);border-radius:4px;height:14px'});
    track.append(el('div',{style:`width:${100*d.value/max}%;background:var(--accent);height:100%;border-radius:4px`}));
    row.append(track,el('div',{class:'num',style:'width:3rem;text-align:right;font-variant-numeric:tabular-nums'},String(d.value)));
    wrap.append(row);
  });
  return wrap;
}
function svgEl(t,a={},...c){const n=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)n.setAttribute(k,a[k]);c.forEach(x=>n.append(x));return n;}

    Object.assign(el('button',{class:'act plain'},'SpamAssassin Bayes'),{onclick:showBayes}),
    Object.assign(el('button',{class:'act plain'},'SpamAssassin lint'),{onclick:showSaLint})));

  // Bulk release / forward of blocked (quarantined) messages

  const bcount=el('span',{class:'muted'});
  const bto=el('input',{placeholder:'forward to (empty = original recipients)',style:'width:20rem'});
  async function bulkRelease(){
    const ids=[...t.querySelectorAll('input.sel:checked')].map(c=>c.dataset.id);
    if(!ids.length){toast('Select messages first');return;}
    const to=bto.value.trim();
    if(to&&!/^[^\s@]+@[^\s@]+$/.test(to)){toast('Enter a valid forward address');return;}
    if(!confirm(`Release ${ids.length} message(s)`+(to?` (forward) to ${to}`:' to their original recipients')+'?\n\nThey are re-sent through Exim. Only messages whose body is still kept can be released.'))return;
    const r=await api('/api/messages/release-bulk',{method:'POST',body:{ids,to}});
    if(r&&typeof r.released==='number'){
      toast(`${r.released}/${r.total} released`);
      const failed=(r.results||[]).filter(x=>x.result!=='released');
      if(failed.length)alert('Not released:\n\n'+failed.map(x=>`${x.id}: ${x.result}`).join('\n'));
      loadList();
    } else toast(r.error||'bulk release failed');
  }
  bulk.append(bcount,bto,
    Object.assign(el('button',{class:'act'},'Release selected'),{onclick:bulkRelease}),
    Object.assign(el('button',{class:'act plain'},'Clear selection'),{onclick:()=>{t.querySelectorAll('input.sel').forEach(c=>c.checked=false);updateBulk();}}));
  card.append(bulk);
  function updateBulk(){
    const n=t.querySelectorAll('input.sel:checked').length;
    bcount.textContent=`${n} selected`;
    bulk.style.display=t.querySelector('input.sel')?'':'none';
  }

  const info=el('div',{class:'muted',style:'margin:.3rem 0'});
  const t=el('table');
  const detail=el('div',{class:'card',style:'display:none'});
  card.append(info,t);v.append(detail);

  async function loadList(){
    const q=`status=${msgF.status}&field=${msgF.field}&text=${encodeURIComponent(msgF.text)}&days=${msgF.days}&offset=${msgF.offset}&limit=${msgLimit()}`;
    const data=await api('/api/messages?'+q);
    t.innerHTML='';info.innerHTML='';
    if(!data||!data.available){t.append(el('tr',{},el('td',{class:'empty'},'No data yet — check the setup card on the Dashboard.')));return;}
    const L=msgLimit();const total=data.total||0,page=Math.floor(msgF.offset/L)+1,pages=Math.max(1,Math.ceil(total/L));
    info.append(`Results: ${total} — page ${page}/${pages}  `);
    const nav=(lbl,off,dis)=>Object.assign(el('button',{class:'act plain',style:'margin-left:.3rem',...(dis?{disabled:'disabled'}:{})},lbl),{onclick:()=>{msgF.offset=off;loadList();}});
    info.append(nav('⟨ prev',Math.max(0,msgF.offset-L),msgF.offset===0),
                nav('next ⟩',msgF.offset+L,msgF.offset+L>=total));
    const jump=el('input',{type:'number',min:1,max:pages,value:page,style:'width:4.5rem;margin-left:.5rem'});
    jump.onchange=()=>{msgF.offset=(Math.min(pages,Math.max(1,+jump.value))-1)*L;loadList();};
    info.append(' jump: ',jump);
    if(!data.items||!data.items.length){t.append(el('tr',{},el('td',{class:'empty'},'No messages match.')));return;}
    t.append(el('tr',{},el('th',{}),...['Time','Score','From / To','Client IP','Subject','Size','Status'].map(h=>el('th',{},h))));
    data.items.forEach(m=>{
      // only messages whose body is still on disk can be re-delivered
      const pick=m.hasbody?el('input',{type:'checkbox',class:'sel','data-id':m.id,title:'select for release/forward'}):el('span',{});
      if(m.hasbody)pick.onclick=e=>{e.stopPropagation();updateBulk();};
      const tr=el('tr',{style:'cursor:pointer'},
        el('td',{},pick),
        el('td',{class:'muted',style:'white-space:nowrap'},m.ts),
        el('td',{class:'num'},m.score||'0'),
        el('td',{},el('div',{},senderLink(m.from)),el('div',{class:'muted'},m.to)),
        el('td',{style:'white-space:nowrap'},m.clientip?ipLink(m.clientip):''),
        el('td',{},m.subject),
        el('td',{class:'num'},fmtSize(m.size)),
        el('td',{},badgeFor(m,true)));
      tr.onclick=()=>showDetail(m.id);
      t.append(tr);
    });
    updateBulk();
  }
  function showDetail(id){
    if(PREFS.view_new_window){window.open(location.pathname.split('?')[0]+(location.search||'')+'#msg='+encodeURIComponent(id),'_blank');return;}
    location.hash='#msg='+encodeURIComponent(id); renderMessageView(id);
  }
  loadList();
}

  let lbl='Clean';

  else if(d.wl)lbl='Whitelisted';else if(d.bl)lbl='Blacklisted';
  card.append(el('h2',{},'Message '+d.id,' ',badgeFor(d)));

  const dt=el('table');
  const row=(k,val)=>{if(val!=null&&String(val).trim()!=='')dt.append(el('tr',{},el('th',{style:'width:12rem'},k),el('td',{style:'word-break:break-word'},String(val))));};

  row('Scanned on',d.hostname);

    (d.components||[]).forEach(c=>ct.append(el('tr',{},
      el('td',{style:'font-family:ui-monospace,monospace'},c.rule),

      el('td',{class:'muted'},c.desc||''))));
    ct.append(el('tr',{},el('th',{},'SpamAssassin score'),el('td',{class:'num'},d.score),el('td',{})));
    sc.append(ct);
  }

  if((d.header_ips||[]).length){
    const hc=el('div',{class:'card'},el('h2',{},'Header IPs'),
      el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.4rem'},'Only the last IP outside your network in the Received: chain can be trusted — the others can be spoofed.'));
    v.append(hc);
    const ht=el('table');ht.append(el('tr',{},...['IP','HELO / Hostname'].map(h=>el('th',{},h))));
    (d.header_ips||[]).forEach(h=>ht.append(el('tr',{},el('td',{style:'font-family:ui-monospace,monospace'},ipLink(h.ip)),el('td',{},h.host||''))));
    hc.append(ht);
  }

  if(d.headers){const hc=el('div',{class:'card'},el('h2',{},'Headers'),el('pre',{class:'log',style:'max-height:20rem'},d.headers));v.append(hc);}

  // Source + rendered views (quarantined only — the body isn't stored otherwise)
  const vc=el('div',{class:'card'},el('h2',{},'Message content'));v.append(vc);
  if(d.has_body){
    vc.append(el('div',{class:'ctl'},
      Object.assign(el('button',{class:'act plain'},'View source'),{onclick:()=>openRaw(d.id,'source')}),
      Object.assign(el('button',{class:'act plain'},'View rendered'),{onclick:()=>openRaw(d.id,'rendered')})));
    if(d.content)vc.append(el('div',{class:'muted',style:'font-size:.8rem;margin:.4rem 0'},'Preview (first 10KB):'),el('pre',{class:'log',style:'max-height:18rem'},d.content));
  } else {
    vc.append(el('div',{class:'muted'},
      d.archive_enabled===false
        ? 'No copy was kept: message archiving is off (enable “Keep a copy of every message” in Settings, or per domain in the user panel).'
        : `The body is no longer available — copies are kept for ${d.bodydays??'the configured number of'} days.`));
  }

  // Actions need the body: Bayes training and re-sending both read it
  if(d.has_body){
    const ac=el('div',{class:'card'},el('h2',{},'Actions'),
      el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.5rem'},
        `Bayes training uses the stored copy (${d.body_kind||'message'}). Release re-sends the message through Exim.`));
    v.append(ac);
    const out=el('pre',{class:'log',style:'display:none;max-height:12rem'});
    async function learn(action,warn){
      if(warn&&!confirm(warn))return;
      out.style.display='';out.textContent='▶ '+action+'…';
      const r=await api('/api/messages/learn',{method:'POST',body:{id:d.id,action}});
      out.textContent=(r.transcript||[r.error||'no response']).join('\n');
      toast(r&&r.ok?action+': done':(action+' failed — see output'));
    }
    ac.append(el('div',{class:'ctl',style:'flex-wrap:wrap'},
      Object.assign(el('button',{class:'act plain'},'Learn as ham'),{onclick:()=>learn('ham')}),
      Object.assign(el('button',{class:'act plain'},'Learn as spam'),{onclick:()=>learn('spam')}),
      Object.assign(el('button',{class:'act plain'},'Learn as spam & report'),{onclick:()=>learn('report','Learn as spam AND report to the collaborative networks (Razor/Pyzor/DCC)?')}),
      Object.assign(el('button',{class:'act plain'},'Forget'),{onclick:()=>learn('forget','Make SpamAssassin forget this message from its Bayes database?')})));
    const rto=el('input',{placeholder:'recipient / account',style:'width:22rem'});
    const relRow=el('div',{class:'ctl',style:'flex-wrap:wrap'},rto,
      Object.assign(el('button',{class:'act'},'Release (resend)'),{onclick:()=>release(d.id,'','resend')}),
      Object.assign(el('button',{class:'act'},'Release (forward)'),{onclick:()=>release(d.id,rto.value.trim(),'forward')}),
      Object.assign(el('button',{class:'act plain',title:'Deliver straight into a local account’s INBOX'},'Deliver to INBOX'),{onclick:()=>release(d.id,rto.value.trim(),'inbox')}));
    if(PREFS.spamcop_address)relRow.append(
      Object.assign(el('button',{class:'act danger'},'Report to SpamCop'),{onclick:async()=>{
        if(!confirm('Forward this message to SpamCop ('+PREFS.spamcop_address+')?'))return;
        const r=await api('/api/messages/spamcop',{method:'POST',body:{id:d.id}});
        toast(r&&r.ok?'Reported to SpamCop':(r.error||'report failed'));
      }}));
    ac.append(relRow,out);
  }
  window.scrollTo(0,0);

  async function release(id,to,mode){
    if((mode==='forward'||mode==='inbox')&&!/^[^\s@]+@[^\s@]+$/.test(to)){toast(mode==='inbox'?'Enter the local account':'Enter a recipient to forward to');return;}
    const what=mode==='inbox'?`Deliver this message into ${to}'s INBOX?`
      :mode==='forward'?`Forward this message to ${to}?`
      :'Re-send this message to its original recipients?';
    if(!confirm(what))return;
    const r=await api('/api/messages/release',{method:'POST',body:{id,to,mode}});
    toast(r&&r.ok?'Done — on its way':(r.error||'release failed'));
  }
}

// Open a quarantined message's raw source or rendered HTML in a new tab.
async function openRaw(id,mode){
  // 'source' shows the message verbatim; 'render' asks the daemon for the
  // MIME-decoded HTML (or text) part, so multipart/quoted-printable bodies
  // come back readable instead of as raw encoded soup
  const r=await apiRaw((mode==='source'?'/api/messages/raw?id=':'/api/messages/preview?id=')+encodeURIComponent(id));
  if(!r.ok){toast(r.text||'the message body is no longer available');return;}
  const w=window.open('','_blank');
  if(!w){toast('Pop-up blocked — allow pop-ups to view');return;}
  if(mode==='source'){
    w.document.write('<pre style="white-space:pre-wrap;word-break:break-word;font:13px ui-monospace,monospace;padding:1rem">'+
      r.text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>');
  } else {
    // render sandboxed: no scripts, no network by CSP (inline images arrive as data: URIs)
    w.document.write('<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'+
      '<div style="font:13px system-ui;padding:.5rem;background:#fffbe6;border-bottom:1px solid #e5c07b">Rendered preview — scripts and remote content are blocked for safety.</div>'+r.text);
  }
  w.document.close();
}

// ---- Rules (structured editor, no raw tabs/spaces) ---------------------------
const DIRS=['To:','From:','FromOrTo:','FromAndTo:'];
async function renderRules(){
  const v=$('#view');v.innerHTML='';
  const files=await api('/api/rules/files');
  const names=(files.files||[]).map(f=>f.name);
  if(!names.length){v.append(el('div',{class:'empty'},'Rules API unavailable.'));return;}

  const fsel=el('select');
  (files.files||[]).forEach(f=>fsel.append(el('option',{value:f.name},f.name+(f.custom?` (${f.custom} custom)`:''))));
  const adoptAll=Object.assign(el('button',{class:'act plain'},'Borrow all current rules'),
    {title:'Absorb every rule found in the live ruleset files (any whitespace style) into the custom store, normalized. Rules already generated from policy and default lines are skipped.',
     onclick:async()=>{
      if(!confirm('Borrow all rules currently in the live ruleset files?\n\nEvery rule not already generated from policy is copied into the custom store (normalized to canonical form) so it survives future syncs. Default lines are skipped — defaults come from policy.'))return;
      adoptAll.disabled=true;
      const r=await api('/api/rules/adopt',{method:'POST',body:{}});
      adoptAll.disabled=false;
      if(r&&r.ok){
        toast(`${r.adopted} rule(s) borrowed`+(r.skipped_defaults?`, ${r.skipped_defaults} default(s) skipped`:'')+(r.unparsed?`, ${r.unparsed} unparsable ignored`:''));
        renderRules();
      } else toast(r.error||'adopt failed');
     }});
  v.append(el('div',{class:'ctl'},el('span',{class:'muted'},'Ruleset:'),fsel,adoptAll));

  // Custom rules editor
  const cc=el('div',{class:'card'},el('h2',{},'Custom rules'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Structured rules merged ahead of the generated domain rules (first match wins) — they survive every sync. Patterns are single tokens like *@domain or user@domain; the value is the action (yes, no, deliver, delete, forward addr@x delete, a spam score…). Formatting is handled for you — no tabs to get wrong.'));
  const rtable=el('table');cc.append(rtable);
  const addBtn=el('button',{class:'act plain'},'+ Add rule');
  const saveBtn=el('button',{class:'act'},'Save & apply');
  cc.append(el('div',{class:'ctl',style:'margin-top:.6rem'},addBtn,saveBtn));
  v.append(cc);

  function rowFor(r){
    const tr=el('tr',{class:'crow'});
    const dsel=el('select',{'data-f':'direction'});DIRS.forEach(d=>dsel.append(el('option',{value:d,...(d===r.direction?{selected:'selected'}:{})},d)));
    const adsel=el('select',{'data-f':'and_direction'});[['',''],...DIRS.map(d=>[d,'and '+d])].forEach(([val,lbl])=>adsel.append(el('option',{value:val,...(val===(r.and_direction||'')?{selected:'selected'}:{})},lbl)));
    tr.append(
      el('td',{},dsel),
      el('td',{},el('input',{'data-f':'pattern',value:r.pattern||'',placeholder:'*@domain.example'})),
      el('td',{},adsel),
      el('td',{},el('input',{'data-f':'and_pattern',value:r.and_pattern||'',placeholder:'(pattern)'})),
      el('td',{},el('input',{'data-f':'value',value:r.value||'',placeholder:'yes / deliver / delete …'})),
      el('td',{},Object.assign(el('button',{class:'act plain'},'✕'),{onclick:()=>tr.remove()})));
    return tr;
  }
  function drawEditor(rules){
    rtable.innerHTML='';
    rtable.append(el('tr',{},...['Direction','Pattern','','and-pattern','Value',''].map(h=>el('th',{},h))));
    rules.forEach(r=>rtable.append(rowFor(r)));
  }
  addBtn.onclick=()=>rtable.append(rowFor({direction:'To:'}));
  saveBtn.onclick=async()=>{
    const rules=[...rtable.querySelectorAll('tr.crow')].map(tr=>{
      const g=f=>tr.querySelector(`[data-f="${f}"]`).value.trim();
      return {direction:g('direction'),pattern:g('pattern'),and_direction:g('and_direction'),and_pattern:g('and_pattern'),value:g('value')};
    });
    saveBtn.disabled=true;
    const r=await api('/api/rules/custom',{method:'PUT',body:{file:fsel.value,rules}});
    saveBtn.disabled=false;
    toast(r&&r.ok?`Saved — ${r.files} rule files written, ${rlbl(r)}`:(r.error||'save failed'));
    if(r&&r.ok)loadLive();
  };

  // Live file view with stray detection
  const lc=el('div',{class:'card'},el('h2',{},'Live ruleset file'));v.append(lc);
  const lhead=el('div',{class:'statline'});const ltable=el('table');
  lc.append(lhead,ltable);
  async function loadLive(){
    const d=await api('/api/rules/live?file='+encodeURIComponent(fsel.value));
    lhead.innerHTML='';ltable.innerHTML='';
    if(d.error){lhead.append(el('span',{class:'muted'},d.error));return;}
    lhead.append(el('span',{class:'muted'},d.path));
    if(d.strays>0){
      lhead.append(el('span',{style:'color:var(--serious)'},`${d.strays} stray rule(s) — hand edits that the next sync will wipe`),
        Object.assign(el('button',{class:'act plain'},'Adopt strays as custom rules'),{onclick:async()=>{
          const r=await api('/api/rules/adopt',{method:'POST',body:{file:fsel.value}});
          toast(r&&r.ok?`${r.adopted} rule(s) adopted (normalized to canonical form)`:(r.error||'adopt failed'));
          load();
        }}));
    }
    if(d.unparsed>0)lhead.append(el('span',{style:'color:var(--critical)'},`${d.unparsed} unparsable line(s)`));
    ltable.append(el('tr',{},...['','Direction','Pattern','Value'].map(h=>el('th',{},h))));
    (d.lines||[]).forEach(l=>{
      if(l.kind==='comment')ltable.append(el('tr',{},el('td',{}),el('td',{class:'muted',colspan:'3'},l.text)));
      else if(l.kind==='unparsed')ltable.append(el('tr',{},
        el('td',{},el('span',{class:'badge',style:'background:var(--critical)'},'bad')),
        el('td',{class:'muted',colspan:'3',style:'font-family:ui-monospace,monospace'},l.text)));
      else ltable.append(el('tr',{},
        el('td',{},l.stray?el('span',{class:'badge',style:'background:var(--serious)'},'stray'):''),
        el('td',{},l.direction+(l.and_direction?` … and ${l.and_direction}`:'')),
        el('td',{style:'font-family:ui-monospace,monospace'},l.pattern+(l.and_pattern?`  /  ${l.and_pattern}`:'')),
        el('td',{},l.value)));
    });
  }

  async function load(){
    const d=await api('/api/rules/custom?file='+encodeURIComponent(fsel.value));
    drawEditor(d.rules||[]);
    loadLive();
  }
  fsel.onchange=load;
  load();
}

// ---- Service ----------------------------------------------------------------
async function renderService(){

  async function refreshStatus(){
    const s=await api('/api/service/status');

    if(s.engine===false||s.engine_configured===false){
      stat.append(el('div',{style:'flex-basis:100%;color:var(--critical);font-weight:600'},
        s.engine===false
          ?'⚠ MailScanner engine is not installed — mail is NOT being scanned. Install it with "msfe-ng engine install" (or reinstall MSFE-NG with --with-engine).'
          :'⚠ MailScanner engine is installed but /etc/MailScanner/MailScanner.conf is missing — run "msfe-ng engine install" to repair.'));

      stat.append(el('div',{style:'flex-basis:100%;color:var(--warning);font-weight:600'},
        '⚠ MailScanner cannot start: its safety switch is OFF. Turn it on below when you are ready.'));
    }
    latch.innerHTML='';
    if(s.engine!==false&&s.engine_configured!==false&&typeof s.engine_run_enabled==='boolean'){
      const on=s.engine_run_enabled;
      latch.append(
        el('span',{},el('span',{class:'dot',style:'background:'+(on?'var(--good)':'var(--warning)')}),
          'Safety switch: '+(on?'ON — MailScanner is allowed to run':'OFF — MailScanner cannot start')),
        Object.assign(el('button',{class:'act plain'},on?'Turn OFF (block MailScanner)':'Turn ON (allow MailScanner to run)'),{onclick:async()=>{
          const msg=on

  }
  async function loadMig(){
    const p=await api('/api/engine/migrate');
    if(!p||p.error||!p.legacy_engine){mig.style.display='none';return;}
    mig.style.display='';migInfo.textContent=`${p.engine}. This replaces ConfigServer's bundled engine and front-end with the MailScanner RPM in one run: backup, snapshot of /usr/mailscanner/etc, stop, ConfigServer's uninstaller${p.uninstaller?'':' (not found — the tree is removed directly)'}, RPM install, configure for Exim carrying the org name over, logging plugin, rules, wiring${p.wiring?' (kept: '+p.wiring+')':' (set up)'}, start, doctor. Mail queues meanwhile — nothing is lost.`;
    migList.innerHTML='';
    (p.warnings||[]).forEach(w=>migList.append(el('li',{style:'color:var(--warning)'},w)));
    (p.blockers||[]).forEach(b=>migList.append(el('li',{style:'color:var(--critical)'},b)));
    if(p.remnants&&p.remnants.length)migList.append(el('li',{},'Legacy files found: '+p.remnants.join(', ')));
    migBtn.disabled=!p.ok;
  }
  migBtn.onclick=async()=>{
    if(!confirm('Migrate to the MailScanner RPM now?\n\nConfigServer\u2019s front-end and its /usr/mailscanner engine are removed and the RPM engine installed and configured. Takes several minutes; incoming mail queues meanwhile and is scanned afterwards. A backup of /etc/msfe-ng and a copy of the legacy etc are kept.'))return;
    migBtn.disabled=true;
    const r=await api('/api/jobs/engine-migrate',{method:'POST'});
    if(!r||!r.ok){toast(r&&r.error||'cannot start');migBtn.disabled=false;return;}
    followMig();
  };
  loadMig();
  api('/api/jobs/engine-migrate').then(s=>{if(s&&s.running){mig.style.display='';migBtn.disabled=true;followMig();}}).catch(()=>{});
  // a job started earlier (or from another window) is still worth following
  for(const [n,l] of [['upgrade','Upgrade MSFE-NG'],['engine-upgrade','Upgrade MailScanner']]){
    api(`/api/jobs/${n}`).then(s=>{if(s&&s.running)followJob(n,l,n==='engine-upgrade'?()=>refreshStatus():null);}).catch(()=>{});
  }

  refreshStatus();refreshQueue();
}

// ---- Logs & queue contents ---------------------------------------------------
async function renderLogs(){
  const v=$('#view');v.innerHTML='';

  // Log viewer (mail log + exim mainlog) with follow
  const lc=el('div',{class:'card logs'},el('h2',{},'Logs'));v.append(lc);
  const lctl=el('div',{class:'ctl'});lc.append(lctl);
  const lsrc=el('select');[['mail','Mail log (MailScanner/syslog)'],['exim','Exim mainlog (deliveries)']].forEach(([val,lbl])=>lsrc.append(el('option',{value:val},lbl)));
  const lsel=el('select');[100,300,1000].forEach(n=>lsel.append(el('option',{value:n},n+' lines')));
  const pre=el('pre',{class:'log'},'Loading…');
  const which=()=>lsrc.value==='exim'?'&which=exim':'';
  // Search state: hits are [file, line-start offset] across the live log and
  // its rotated siblings; the viewer only ever holds a window around one hit.
  // mode: 'tail' | 'search' | 'day' (a day opened without a pattern).
  const S={mode:'tail',needle:'',hits:[],cur:-1,truncated:false,win:null,day:null};
  async function refreshLog(){
    if(S.mode!=='tail')return;
    const text=await api('/api/service/maillog?lines='+lsel.value+which(),{raw:true});
    const stick=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-4;
    pre.textContent=text||'(empty)';
    if(stick)pre.scrollTop=pre.scrollHeight;
  }
  const auto=el('input',{type:'checkbox',id:'logauto'});
  auto.onchange=()=>{clearInterval(logTimer);logTimer=auto.checked?setInterval(refreshLog,5000):null;};
  lsel.onchange=refreshLog;
  lctl.append(lsrc,lsel,
    Object.assign(el('button',{class:'act plain'},'Refresh'),{onclick:refreshLog}),
    auto,el('label',{for:'logauto',class:'muted'},'follow (5s)'));

  // Whole-log search: server returns hit offsets, we page windows around them.
  const sctl=el('div',{class:'ctl'});lc.append(sctl);
  const daybtn=el('button',{class:'act plain daybtn',title:'restrict to one day'});
  const sinp=el('input',{placeholder:'search whole log… (Enter: older hit, Shift+Enter: newer, Esc: clear)',style:'width:24rem'});
  const sbtn=el('button',{class:'act plain'},'Search');
  const prev=el('button',{class:'act plain',title:'older hit'},'◀ older');
  const next=el('button',{class:'act plain',title:'newer hit'},'newer ▶');
  const count=el('span',{class:'muted'});
  const clr=el('button',{class:'act plain',title:'clear search'},'✕');
  sctl.append(daybtn,sinp,sbtn,prev,next,count,clr);

  // ---- day picker: a calendar of the days present in the log set ----
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const fmtDay=d=>+d.slice(8,10)+' '+MON[+d.slice(5,7)-1];
  let DAYS=null,DAYS_AT=0,DAYS_SRC='';
  async function loadDays(force){
    if(!force&&DAYS&&DAYS_SRC===lsrc.value&&Date.now()-DAYS_AT<60000)return DAYS;
    const r=await api('/api/service/maillog/days?x=1'+which());
    DAYS=(r&&!r.error)?r:{days:[],files:[],error:r?.error};DAYS_AT=Date.now();DAYS_SRC=lsrc.value;
    return DAYS;
  }
  const liveName=()=>DAYS&&DAYS.files.length?DAYS.files[DAYS.files.length-1].name:null;
  function setDayLabel(){
    daybtn.textContent=(S.day?'📅 '+fmtDay(S.day):'📅 Any day')+' ▾';
    daybtn.classList.toggle('on',!!S.day);
  }
  let cal=null,calDoc=null;
  function closeCal(){if(cal){cal.remove();cal=null;}if(calDoc){document.removeEventListener('mousedown',calDoc);document.removeEventListener('keydown',calDoc);calDoc=null;}}
  async function openCal(){
    if(cal){closeCal();return;}
    cal=el('div',{class:'cal'},el('div',{class:'muted',style:'padding:.5rem'},'Loading…'));
    lc.append(cal);
    cal.style.top=(daybtn.offsetTop+daybtn.offsetHeight+4)+'px';cal.style.left=daybtn.offsetLeft+'px';
    calDoc=e=>{if(e.type==='keydown'?e.key==='Escape':!(cal.contains(e.target)||daybtn.contains(e.target)))closeCal();};
    document.addEventListener('mousedown',calDoc);document.addEventListener('keydown',calDoc);
    const d=await loadDays();
    if(!cal)return;
    if(!d.days.length){cal.innerHTML='';cal.append(el('div',{class:'muted',style:'padding:.5rem'},d.error||'no dated lines in this log'));return;}
    const sel=S.day||d.days[d.days.length-1].date;
    drawCal(d,+sel.slice(0,4),+sel.slice(5,7));
  }
  function drawCal(d,y,m){
    const has=new Map(d.days.map(x=>[x.date,x]));
    const first=d.days[0].date,last=d.days[d.days.length-1].date;
    const ym=(yy,mm)=>yy*12+mm-1;
    const lo=ym(+first.slice(0,4),+first.slice(5,7)),hi=ym(+last.slice(0,4),+last.slice(5,7)),cur=ym(y,m);
    const today=new Date().toISOString().slice(0,10);
    cal.innerHTML='';
    const pv=Object.assign(el('button',{class:'act plain',title:'previous month'},'‹'),{disabled:cur<=lo,onclick:()=>drawCal(d,m===1?y-1:y,m===1?12:m-1)});
    const nx=Object.assign(el('button',{class:'act plain',title:'next month'},'›'),{disabled:cur>=hi,onclick:()=>drawCal(d,m===12?y+1:y,m===12?1:m+1)});
    cal.append(el('div',{class:'cal-head'},pv,el('span',{class:'cal-title'},MONL[m-1]+' '+y),nx));
    const grid=el('div',{class:'cal-grid'});
    ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(w=>grid.append(el('span',{class:'cal-dow'},w)));
    const startDow=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7;
    const ndays=new Date(Date.UTC(y,m,0)).getUTCDate();
    for(let i=0;i<startDow;i++)grid.append(el('span'));
    for(let day=1;day<=ndays;day++){
      const iso=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const info=has.get(iso);
      const b=el('button',{class:'cal-day'+(info?' has':'')+(iso===S.day?' sel':'')+(iso===today?' today':'')},String(day));
      if(info){b.title='in '+info.file;b.onclick=()=>pickDay(iso);}else b.disabled=true;
      grid.append(b);
    }
    cal.append(grid);
    const any=Object.assign(el('button',{class:'act plain'},'Any day'),{disabled:!S.day,onclick:()=>pickDay(null)});
    cal.append(el('div',{class:'cal-foot'},any,el('span',{class:'muted'},d.days.length+' days · '+d.files.length+' file'+(d.files.length===1?'':'s')+' · since '+fmtDay(first))));
  }
  function pickDay(iso){
    S.day=iso;setDayLabel();closeCal();
    if(sinp.value.trim())doSearch(true);
    else if(iso)jumpToDay();
    else clearSearch();
  }
  daybtn.onclick=openCal;
  setDayLabel();

  function setNav(){
    prev.disabled=S.cur<=0;next.disabled=S.cur<0||S.cur>=S.hits.length-1;
    if(S.mode==='tail'){count.textContent='';return;}
    const where=(S.win&&liveName()&&S.win.file!==liveName())?' · '+S.win.file:'';
    if(S.mode==='day'){count.textContent=fmtDay(S.day)+' · start of day'+where;return;}
    count.textContent=(S.cur+1)+' / '+S.hits.length+(S.day?' · '+fmtDay(S.day):'')+(S.truncated?' (newest only, older hits not listed)':'')+where;
  }
  // Highlight every occurrence of the needle in one line (HTML-escaped).
  function markLine(line){
    const nd=S.needle.toLowerCase();if(!nd)return esc(line);
    const lo=line.toLowerCase();let out='',i=0;
    for(;;){const j=lo.indexOf(nd,i);if(j<0)break;out+=esc(line.slice(i,j))+'<mark>'+esc(line.slice(j,j+nd.length))+'</mark>';i=j+nd.length;}
    return out+esc(line.slice(i));
  }
  function renderWindow(w){
    S.win=w;
    pre.innerHTML=w.text.split('\n').map(l=>'<span class="ln">'+markLine(l)+'</span>').join('\n');
  }
  // Line index of a hit inside the current window (hits are line starts).
  function lineIndexOf(off){
    const lines=S.win.text.split('\n');let pos=S.win.start;
    for(let i=0;i<lines.length;i++){if(pos===off)return i;pos+=lines[i].length+1;}
    return -1;
  }
  async function fetchWindow(file,at,before,after){
    const w=await api('/api/service/maillog/window?file='+encodeURIComponent(file)+'&at='+at+'&before='+before+'&after='+after+which());
    if(!w||w.error){pre.textContent=w?.error||'(error)';return null;}
    renderWindow(w);return w;
  }
  async function showHit(){
    const [file,off]=S.hits[S.cur];
    if(!S.win||S.win.file!==file||off<S.win.start||off>=S.win.end){
      if(!await fetchWindow(file,off,200,200))return;
    }
    pre.querySelectorAll('.ln.cur').forEach(n=>n.classList.remove('cur'));
    const idx=lineIndexOf(off),ln=pre.querySelectorAll('.ln')[idx];
    if(ln){ln.classList.add('cur');pre.scrollTop=ln.offsetTop-pre.clientHeight/2+ln.offsetHeight/2;}
    setNav();
  }
  function pauseFollow(){auto.checked=false;clearInterval(logTimer);logTimer=null;}
  // A day with no pattern: open the log where that day begins.
  async function jumpToDay(){
    const d=await loadDays();
    const info=d.days.find(x=>x.date===S.day);
    if(!info){count.textContent='no lines on '+fmtDay(S.day);return;}
    pauseFollow();
    Object.assign(S,{mode:'day',needle:'',hits:[],cur:-1,truncated:false,win:null});
    if(await fetchWindow(info.file,info.start,0,400))pre.scrollTop=0;
    setNav();
  }
  async function doSearch(fresh){
    const q=sinp.value.trim();
    if(!q){if(S.day)jumpToDay();else clearSearch();return;}
    if(!fresh&&S.mode==='search'&&q===S.needle){step(-1);return;}
    count.textContent='searching…';
    const [r]=await Promise.all([api('/api/service/maillog/search?q='+encodeURIComponent(q)+(S.day?'&day='+S.day:'')+which()),loadDays()]);
    if(!r||r.error){count.textContent=r?.error||'error';return;}
    if(!r.total){count.textContent='no matches'+(S.day?' on '+fmtDay(S.day):'');return;}
    pauseFollow();
    Object.assign(S,{mode:'search',needle:q,hits:r.hits,truncated:r.truncated,win:null,cur:r.hits.length-1});
    await showHit();
  }
  function step(d){if(S.mode!=='search')return;const n=S.cur+d;if(n<0||n>=S.hits.length)return;S.cur=n;showHit();}
  function clearSearch(){
    Object.assign(S,{mode:'tail',needle:'',hits:[],cur:-1,truncated:false,win:null});
    sinp.value='';setNav();pre.textContent='Loading…';refreshLog();
  }
  sbtn.onclick=()=>doSearch();prev.onclick=()=>step(-1);next.onclick=()=>step(1);
  clr.onclick=()=>{S.day=null;setDayLabel();clearSearch();};
  sinp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();e.shiftKey?step(1):doSearch();}
    else if(e.key==='Escape'){e.preventDefault();S.day=null;setDayLabel();clearSearch();}
  };
  lsrc.onchange=()=>{closeCal();DAYS=null;S.day=null;setDayLabel();if(S.mode!=='tail')clearSearch();else{pre.textContent='Loading…';refreshLog();}};
  setNav();
  lc.append(pre);
  refreshLog();
}

// ---- Quarantine (on-disk browser + purge) ------------------------------------
async function renderQuarantine(){
  const v=$('#view');v.innerHTML='';
  const card=el('div',{class:'card'},el('h2',{},'Quarantine contents'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'What is actually on disk in the quarantine directory — including files no database row knows about. Purging deletes the stored copy permanently; the message log entry (if any) is kept.'));
  v.append(card);
  const totals=el('span',{class:'muted',style:'margin-left:auto;font-size:.8rem'});
  const table=el('table');
  const fmtB=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?Math.round(b/1024)+' KB':b+' B';
  const fmtD=d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  let ENTRIES=[],SEL=new Set();
  const key=e=>e.date+'/'+e.id;
  const purgeSel=el('button',{class:'act danger'},'Purge selected');
  const days=el('input',{type:'number',min:'1',value:'30',style:'width:5rem'});
  const prevBtn=el('button',{class:'act plain'},'Preview');
  const oldBtn=el('button',{class:'act danger'},'Purge older');
  const out=el('pre',{class:'log',style:'display:none'},'');
  const ctl=el('div',{class:'ctl'},purgeSel,
    el('span',{class:'muted',style:'margin-left:1rem'},'Older than'),days,
    el('span',{class:'muted'},'days:'),prevBtn,oldBtn,totals);
  card.append(ctl,out,table);

  function draw(){
    table.innerHTML='';
    table.append(el('tr',{},el('th',{},''),...['Date','Message','Type','Size','From','Subject','Score'].map(h=>el('th',{},h))));
    if(!ENTRIES.length){table.append(el('tr',{},el('td',{colspan:'8',class:'empty'},'Quarantine is empty.')));return;}
    ENTRIES.forEach(e=>{
      const cb=el('input',{type:'checkbox',...(SEL.has(key(e))?{checked:'checked'}:{})});
      cb.onchange=()=>{cb.checked?SEL.add(key(e)):SEL.delete(key(e));purgeSel.textContent=SEL.size?`Purge selected (${SEL.size})`:'Purge selected';};
      const row=el('tr',{},el('td',{},cb),
        el('td',{},fmtD(e.date)),
        el('td',{style:'font-family:var(--font-mono,monospace);font-size:.85em'},e.id),
        el('td',{},el('span',{class:'badge',style:'background:'+(e.kind==='spam'?'var(--warning)':'var(--ink2)')},e.kind)),
        el('td',{class:'num'},fmtB(e.size)),
        el('td',{},e.from||el('span',{class:'muted'},'—')),
        el('td',{},e.subject||el('span',{class:'muted'},'(not in message log)')),
        el('td',{class:'num'},e.sascore||'—'));
      row.style.cursor='pointer';
      row.onclick=ev=>{if(ev.target.tagName==='INPUT')return;view(e);};
      table.append(row);
    });
  }
  async function view(e){
    const m=modal(`${e.id} — ${fmtD(e.date)}`);
    m.body.append(el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.5rem'},'Message headers as stored in the quarantine.'));
    const pre=el('pre',{class:'log'},'Loading…');m.body.append(pre);
    pre.textContent=await api('/api/quarantine/message?date='+e.date+'&id='+encodeURIComponent(e.id),{raw:true})||'(no output)';
  }
  async function load(){
    table.innerHTML='';table.append(el('tr',{},el('td',{class:'empty'},'Loading…')));
    const d=await api('/api/quarantine?limit=2000');
    ENTRIES=(d&&d.entries)||[];SEL=new Set();purgeSel.textContent='Purge selected';
    totals.textContent=d?`${d.total} item(s), ${fmtB(d.bytes)}${d.truncated?' — showing first '+ENTRIES.length:''}`:'';
    draw();
  }
  purgeSel.onclick=async()=>{
    if(!SEL.size)return toast('Select messages first');
    if(!confirm(`Permanently delete ${SEL.size} quarantined message(s) from disk?`))return;
    const items=ENTRIES.filter(e=>SEL.has(key(e))).map(e=>({date:e.date,id:e.id}));
    const r=await api('/api/quarantine/purge',{method:'POST',body:{items,dry:false}});
    out.style.display='';out.textContent=r?`removed ${r.removed} item(s), ${fmtB(r.bytes)} freed`+(r.errors&&r.errors.length?'\n'+r.errors.join('\n'):''):'no response';
    toast(r&&r.ok?`Purged ${r.removed} message(s)`:'Purge finished with errors — see output');
    load();
  };
  prevBtn.onclick=async()=>{
    const r=await api('/api/quarantine/purge-older',{method:'POST',body:{days:+days.value||30,dry:true}});
    out.style.display='';out.textContent=r&&!r.error?`dry-run: would remove ${r.removed} item(s), ${fmtB(r.bytes)}`:(r&&r.error||'no response');
  };
  oldBtn.onclick=async()=>{
    const n=+days.value||30;
    if(!confirm(`Permanently delete ALL quarantined messages older than ${n} days?\n\nUse Preview first to see what this removes.`))return;
    const r=await api('/api/quarantine/purge-older',{method:'POST',body:{days:n,dry:false}});
    out.style.display='';out.textContent=r&&!r.error?`removed ${r.removed} item(s), ${fmtB(r.bytes)} freed`:(r&&r.error||'no response');
    toast(r&&r.ok?`Purged ${r.removed} message(s)`:'Purge finished with errors — see output');
    load();
  };
  load();
}

// ---- Queues (contents + per-message management) ------------------------------
async function renderQueues(){
  const v=$('#view');v.innerHTML='';
  const qc=el('div',{class:'card'},el('h2',{},'Queue contents'),
    el('div',{class:'muted',style:'margin-bottom:.5rem;font-size:.8rem'},
      'Parsed from the Exim spool: sender, recipients, subject, spam score and frozen state per message. A sender of ∅ (null sender) is a bounce — or spam sent so it can never be bounced back; frozen messages are stuck (Exim can’t deliver or bounce them). Messages sit in the MailScanner queue only for the seconds between arrival and scanning.'));
  v.append(qc);
  const qctl=el('div',{class:'ctl'});qc.append(qctl);
  const qsrc=el('select');[['mailscanner','MailScanner queue (waiting for scan)'],['main','Main queue (delivery)']].forEach(([val,lbl])=>qsrc.append(el('option',{value:val},lbl)));
  const qtable=el('table');
  const qpre=el('pre',{class:'log',style:'display:none'},'');
  const qdetail=el('pre',{class:'log',style:'display:none;max-height:20rem'});
  const qcount=el('span',{class:'muted',style:'margin-left:auto;font-size:.8rem'});
  let QMSGS=[],QSEL=new Set(),QFILT='all',QTEXT='',QTRUNC=false;
  const fmtAge=s=>s>=86400?Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h':s>=3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':s>=60?Math.floor(s/60)+'m':s+'s';
  const fmtSz=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?Math.round(b/1024)+' KB':b+' B';
  function scoreCell(m){
    if(m.spam_score==null)return el('td',{class:'num muted'},'—');
    const s=+m.spam_score;
    const col=s>=10?'var(--critical)':s>=5?'var(--warning)':'var(--ink2)';
    return el('td',{class:'num',style:'color:'+col+';font-weight:'+(s>=5?'700':'400'),title:'spam score '+s.toFixed(1)},
      s.toFixed(1),
      s>=5?el('span',{class:'badge',style:'background:'+col+';margin-left:.4rem'},s>=10?'high spam':'spam'):'');
  }
  function visible(){
    return QMSGS.filter(m=>{
      if(QFILT==='frozen'&&!m.frozen)return false;
      if(QFILT==='bounce'&&!m.bounce)return false;
      if(QFILT==='spam'&&!(m.spam_score!=null&&+m.spam_score>=5))return false;
      if(QTEXT){
        const t=QTEXT.toLowerCase();
        if(!((m.sender||'').toLowerCase().includes(t)||(m.subject||'').toLowerCase().includes(t)||
             m.recipients.some(r=>r.toLowerCase().includes(t))||m.id.toLowerCase().includes(t)))return false;
      }
      return true;
    });
  }
  async function msgView(id,what){
    qdetail.style.display='';
    qdetail.textContent='Loading '+what+'…';
    qdetail.textContent=await api(`/api/service/queue/msg?which=${qsrc.value}&id=${encodeURIComponent(id)}&what=${what}`,{raw:true});
  }
  async function msgAction(id,action){
    const warn=action==='delete'
      ?`Delete ${id} from the queue?\n\nThe message is removed permanently.`
      :(qsrc.value==='mailscanner'
        ?`Deliver ${id} NOW from the scanning queue?\n\nThis BYPASSES MailScanner scanning for this message.`
        :`Force delivery of ${id} now (works for frozen messages too)?\n\nThis can take a while if the remote server is slow.`);
    if(!confirm(warn))return;
    qdetail.style.display='';qdetail.textContent=`▶ ${action} ${id}…`;
    const r=await api('/api/service/queue/action',{method:'POST',body:{which:qsrc.value,id,action}});
    qdetail.textContent=(r.transcript||[r.error||'no response']).join('\n');
    toast(r&&r.ok?`${action}: ok`:`${action} failed — see output`);
    refreshQ();
  }
  async function bulkAction(action){
    const ids=[...QSEL];
    if(!ids.length)return;
    const warn=action==='delete'
      ?`Delete ${ids.length} selected message(s) from the queue?\n\nThey are removed permanently.`
      :`Force delivery of ${ids.length} selected message(s)?`+(qsrc.value==='mailscanner'?'\n\nThis BYPASSES MailScanner scanning for them.':'');
    if(!confirm(warn))return;

  // one-click purge: delete every spam/bounce message, re-fetching pages until none match
  async function purge(kind){
    const match=kind==='spam'?(m=>m.spam_score!=null&&+m.spam_score>=5):(m=>!!m.bounce);
    const what=kind==='spam'?'spam messages (score ≥5)':'bounce messages (null sender ∅)';
    let ids=QMSGS.filter(match).map(m=>m.id);
    if(!ids.length)return;
    if(!confirm(`Delete ALL ${what} from this queue?\n\n${ids.length}${QTRUNC?'+':''} matching message(s)${QTRUNC?' — the queue is larger than the loaded page, deletion repeats until no matches remain':''}.\n\nThey are removed permanently.`))return;

    let done=0,out=[];
    for(let round=0;round<20&&ids.length;round++){
      qdetail.textContent=`▶ deleting ${what}… ${done} done, ${ids.length} in this round`;
      const r=await api('/api/service/queue/bulk',{method:'POST',body:{which:qsrc.value,ids,action:'delete'}});
      out=r&&r.transcript||[r&&r.error||'no response'];
      if(!r||!r.ok)break;
      done+=ids.length;
      const d=await api('/api/service/queue/detail?which='+qsrc.value+'&limit=2000');
      ids=d&&Array.isArray(d.msgs)?d.msgs.filter(match).map(m=>m.id):[];
    }
    qdetail.textContent=out.join('\n')+(done?`\n→ ${done} message(s) deleted`:'');

  const bSpamAll=Object.assign(el('button',{class:'act danger'},'Delete all spam'),{onclick:()=>purge('spam')});
  const bBncAll=Object.assign(el('button',{class:'act danger'},'Delete all bounces'),{onclick:()=>purge('bounce')});
  const fbtns={};
  const bulkbar=el('div',{class:'ctl',style:'display:none'});

  const bDlv=Object.assign(el('button',{class:'act plain'},'Deliver selected'),{onclick:()=>bulkAction('deliver')});
  const bulkInfo=el('span',{class:'muted'});
  bulkbar.append(bDel,bDlv,bulkInfo);
  function syncBulk(){
    bulkbar.style.display=QSEL.size?'':'none';
    bulkInfo.textContent=QSEL.size+' selected';
    bDel.textContent=`Delete selected (${QSEL.size})`;
    bDlv.textContent=`Deliver selected (${QSEL.size})`;
  }
  function drawTable(){
    const rows=visible();

    // filter-button counts reflect the whole loaded page
    const n={all:QMSGS.length,frozen:QMSGS.filter(m=>m.frozen).length,bounce:QMSGS.filter(m=>m.bounce).length,
      spam:QMSGS.filter(m=>m.spam_score!=null&&+m.spam_score>=5).length};
    for(const k in fbtns){fbtns[k].textContent=fbtns[k].dataset.lbl+' ('+n[k]+')';fbtns[k].className=QFILT===k?'act':'act plain';}
    const plus=QTRUNC?'+':'';
    bSpamAll.textContent=`Delete all spam (${n.spam}${plus})`;bSpamAll.disabled=!n.spam;
    bBncAll.textContent=`Delete all bounces (${n.bounce}${plus})`;bBncAll.disabled=!n.bounce;
    if(!rows.length){
      qtable.append(el('tr',{},el('td',{class:'muted'},QMSGS.length?'No messages match this filter.':'Queue is empty.')));

    }

    selAll.checked=rows.length&&rows.every(m=>QSEL.has(m.id));
    selAll.onchange=()=>{rows.forEach(m=>selAll.checked?QSEL.add(m.id):QSEL.delete(m.id));drawTable();};
    qtable.append(el('tr',{},el('th',{},selAll),...['Age','Size','Message','Score','From','To','Subject','',''].map(h=>el('th',{},h))));
    rows.forEach(m=>{
      const cb=el('input',{type:'checkbox'});
      cb.checked=QSEL.has(m.id);
      cb.onchange=()=>{cb.checked?QSEL.add(m.id):QSEL.delete(m.id);syncBulk();};
      qtable.append(el('tr',{},

          m.frozen?el('span',{class:'badge',style:'background:var(--serious);margin-left:.4rem'},'frozen'):'',
          m.parsed?'':el('span',{class:'badge',style:'background:var(--muted);margin-left:.4rem',title:'spool header could not be parsed — only age and size are known'},'?')),
        scoreCell(m),
        el('td',{},m.bounce?el('span',{class:'badge',style:'background:var(--ink2)',title:'null envelope sender — a bounce, or spam sent so it can never be bounced back'},'∅ bounce'):(m.sender||'—')),
        el('td',{title:m.recipients.join(', ')},m.recipients[0]||'—',m.recipients.length>1?el('span',{class:'muted'},' +'+(m.recipients.length-1)):''),
        el('td',{style:'max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',title:m.subject||''},m.subject||el('span',{class:'muted'},'—')),
        el('td',{},...['headers','body','log'].map(w=>Object.assign(el('button',{class:'act plain',style:'margin-right:.25rem'},w),{onclick:()=>msgView(m.id,w)}))),
        el('td',{},
          Object.assign(el('button',{class:'act',style:'margin-right:.25rem'},'Deliver'),{onclick:()=>msgAction(m.id,'deliver')}),
          Object.assign(el('button',{class:'act danger'},'Delete'),{onclick:()=>msgAction(m.id,'delete')}))));
    });
    syncBulk();
  }
  async function refreshQ(){
    const d=await api('/api/service/queue/detail?which='+qsrc.value+'&limit=500');
    if(d&&Array.isArray(d.msgs)){
      QMSGS=d.msgs;
      // drop selections for messages no longer in the queue
      const ids=new Set(QMSGS.map(m=>m.id));QSEL.forEach(id=>{if(!ids.has(id))QSEL.delete(id);});
      QTRUNC=!!d.truncated;
      qcount.textContent=d.truncated?`showing oldest ${QMSGS.length} of ${d.total}`:`${d.total} message(s)`;
    }else{QMSGS=[];QTRUNC=false;qcount.textContent='';}
    drawTable();
    if(qraw.checked)qpre.textContent=await api('/api/service/queue/listing?which='+qsrc.value,{raw:true});
  }
  qsrc.onchange=()=>{qdetail.style.display='none';QSEL.clear();refreshQ();};
  const qauto=el('input',{type:'checkbox',id:'qauto'});
  qauto.onchange=()=>{clearInterval(jrnTimer);jrnTimer=qauto.checked?setInterval(refreshQ,5000):null;};
  const qraw=el('input',{type:'checkbox',id:'qraw'});
  qraw.onchange=()=>{qpre.style.display=qraw.checked?'':'none';qtable.style.display=qraw.checked?'none':'';refreshQ();};
  async function repairSpool(dry){
    if(!dry&&!confirm('Move misplaced spool files into the subdirectories Exim expects, then force a delivery run?\n\nNothing is deleted. Messages Exim could not find become deliverable again.'))return;
    qdetail.style.display='';qdetail.textContent='▶ '+(dry?'checking':'repairing')+' spool placement…';
    const r=await api('/api/service/queue/repair-spool',{method:'POST',body:{dry_run:dry}});
    qdetail.textContent=(r.actions||[r.error||'no response']).join('\n')+
      (r.ok?`\n→ ${r.moved} file(s) moved${r.dry_run?' (dry-run)':(r.flush_started?', delivery run started':'')}`:'');
    if(!dry)refreshQ();
  }
  qctl.append(qsrc,
    Object.assign(el('button',{class:'act plain'},'Refresh'),{onclick:refreshQ}),
    qauto,el('label',{for:'qauto',class:'muted'},'follow (5s)'),
    qraw,el('label',{for:'qraw',class:'muted'},'raw'),
    Object.assign(el('button',{class:'act plain',title:'Check whether queued files sit in the split-spool subdirectory Exim expects'},'Check spool placement'),{onclick:()=>repairSpool(true)}),
    Object.assign(el('button',{class:'act'},'Fix misplaced spool files'),{onclick:()=>repairSpool(false)}),
    qcount);
  // quick filters + search over the loaded rows
  const filtbar=el('div',{class:'ctl'});
  [['all','All'],['frozen','Frozen'],['bounce','Bounces'],['spam','Spam ≥5']].forEach(([k,lbl])=>{
    const b=el('button',{class:'act plain','data-lbl':lbl},lbl);
    b.dataset.lbl=lbl;
    b.onclick=()=>{QFILT=k;drawTable();};
    fbtns[k]=b;filtbar.append(b);
  });
  const qsearch=el('input',{placeholder:'search sender / recipient / subject / id…',style:'flex:1;max-width:22rem'});
  qsearch.oninput=()=>{QTEXT=qsearch.value.trim();drawTable();};
  filtbar.append(qsearch,bSpamAll,bBncAll);
  qc.append(filtbar,bulkbar,qtable,qpre,qdetail);
  refreshQ();
}

// ---- Config: the whole MailScanner etc tree ---------------------------------
// One catalog of files (GET /api/conf/tree), one editor per kind, every save
// through PUT /api/conf/file → validate on a staged copy → backup → apply →
// restart/reload. Ids are the server's; the browser never names a path.
const KIND_LABEL={keyvalue:'settings',toml:'settings','rules':'ruleset','filename-rules':'file rules','spam-lists':'RBL list','virus-scanners':'scanners','host-list':'hosts',text:'text',readonly:'locked'};
const RELOAD_LABEL={restart:'restart on save',reload:'reload on save',none:'no reload'};
const RELOAD_HINT={restart:'MailScanner reads this file only at start: saving restarts it (scanning pauses for a few seconds; mail queues meanwhile).',reload:'MailScanner re-reads this file for every batch: saving reloads it without a restart.',none:'MailScanner does not read this file; saving needs no reload.'};
const fmtTime=t=>t?new Date(t*1000).toLocaleString():'';

// Line diff without a library: strip the common head and tail, LCS over the
// middle (bounded — beyond that the middle is shown as replaced).
function lineDiff(a,b){
  const A=a.split('\n'),B=b.split('\n');
  let s=0;while(s<A.length&&s<B.length&&A[s]===B[s])s++;
  let e=0;while(e<A.length-s&&e<B.length-s&&A[A.length-1-e]===B[B.length-1-e])e++;
  const X=A.slice(s,A.length-e),Y=B.slice(s,B.length-e);
  const out=[];
  for(let i=0;i<s;i++)out.push({t:' ',s:A[i]});
  if(X.length*Y.length>1500*1500){X.forEach(l=>out.push({t:'-',s:l}));Y.forEach(l=>out.push({t:'+',s:l}));}
  else{
    const n=X.length,m=Y.length,L=new Uint16Array((n+1)*(m+1));
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*(m+1)+j]=X[i]===Y[j]?L[(i+1)*(m+1)+j+1]+1:Math.max(L[(i+1)*(m+1)+j],L[i*(m+1)+j+1]);
    let i=0,j=0;
    while(i<n&&j<m){
      if(X[i]===Y[j]){out.push({t:' ',s:X[i]});i++;j++;}
      else if(L[(i+1)*(m+1)+j]>=L[i*(m+1)+j+1]){out.push({t:'-',s:X[i]});i++;}
      else{out.push({t:'+',s:Y[j]});j++;}
    }
    while(i<n){out.push({t:'-',s:X[i++]});}
    while(j<m){out.push({t:'+',s:Y[j++]});}
  }
  for(let i=A.length-e;i<A.length;i++)out.push({t:' ',s:A[i]});
  return out;
}
// Render a diff with a little context around each change.
function renderDiff(ops,ctx=3){
  const pre=el('pre',{class:'log diff'});
  const keep=new Set();
  ops.forEach((o,i)=>{if(o.t!==' ')for(let k=Math.max(0,i-ctx);k<=Math.min(ops.length-1,i+ctx);k++)keep.add(k);});
  if(!keep.size){pre.textContent='No differences.';return pre;}
  let gap=false;
  ops.forEach((o,i)=>{
    if(!keep.has(i)){gap=true;return;}
    if(gap){pre.append(el('span',{class:'gap'},'⋯\n'));gap=false;}
    pre.append(el('span',{class:o.t==='+'?'add':o.t==='-'?'del':''},(o.t==='+'?'+ ':o.t==='-'?'− ':'  ')+o.s+'\n'));
  });
  return pre;
}

// Key/value editor: entries as fields, comments shown and preserved; the save
// body carries only the keys that changed. (Typed inputs arrive with the
// engine schema.)
function kvEditor(d){
  const root=el('div',{class:'kv'});
  const filter=el('input',{placeholder:'filter settings…',style:'max-width:20rem;margin-bottom:.5rem'});
  const showChanged=el('label',{class:'muted',style:'font-size:.78rem;margin-left:.8rem'},el('input',{type:'checkbox'}),' only settings that differ from the engine default');
  const rows=el('div',{class:'kvrows'});
  const ORIG={};
  const schema=d.schema||null,rulesets=d.rulesets||[],overrides=d.overrides||{};
  const isRulesetPath=v=>/\.rules$|%rules-dir%|\//.test(v)&&!/^\d/.test(v)&&v.includes('/');
  function pickRuleset(inp){
    const m=modal('Choose a ruleset');
    if(!rulesets.length){m.body.append(el('div',{class:'muted'},'No rulesets under rules/ yet — create one with "+ New" in the file tree.'));return;}
    m.body.append(el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.5rem'},'The directive then takes its value per sender/recipient from the ruleset (first match wins). The file is referenced through %rules-dir%.'));
    rulesets.forEach(r=>m.body.append(Object.assign(el('button',{class:'act plain',style:'display:block;width:100%;text-align:left;margin:.15rem 0'},el('span',{class:'mono'},r)),{onclick:()=>{setVal(inp,'%rules-dir%/'+r);m.close();}})));
  }
  function setVal(inp,v){inp.value=v;inp.dispatchEvent(new Event('input'));}
  (d.parsed||[]).forEach(l=>{
    if(l.t==='comment'||l.t==='other')rows.append(el('div',{class:'muted cmt'},l.text));
    else if(l.t==='entry'){
      ORIG[l.key]=l.value;
      const def=schema?schema[l.key]:undefined;
      let inp;
      if(def&&def.type==='yesno'&&def.options.length&&(def.options.includes(l.value.toLowerCase())||l.value==='')){
        inp=el('select',{'data-k':l.key});
        def.options.forEach(o=>inp.append(el('option',{value:o,...(o===l.value.toLowerCase()?{selected:'selected'}:{})},o)));
        if(l.value==='')inp.prepend(el('option',{value:'',selected:'selected'},'(empty)'));
      } else if(def&&def.type==='number'&&/^-?\d*$/.test(l.value)){
        inp=el('input',{type:'number',value:l.value,'data-k':l.key});
      } else {
        inp=el('input',{value:l.value,'data-k':l.key});
        if(def&&['file','dir','command'].includes(def.type)||isRulesetPath(l.value))inp.classList.add('mono');
      }
      const row=el('div',{class:'kvrow'},el('div',{class:'k',title:l.key},l.key),inp);
      const tags=el('span',{class:'ktags'});
      const upd=()=>{
        inp.classList.toggle('changed',inp.value!==ORIG[l.key]);
        tags.innerHTML='';
        if(def&&def.type==='variable'){
          tags.append(el('span',{class:'ktag',title:'A %variable% other settings in this file refer to'},'variable'));
        } else if(def){
          // %etc-dir%/x and /etc/MailScanner/x are the same path: expand before comparing
          const expand=v=>{let s=String(v);for(let i=0;i<4&&/%[a-z-]+%/.test(s);i++)s=s.replace(/%[a-z-]+%/g,m=>ORIG[m]!==undefined?ORIG[m]:m);return s.trim().toLowerCase();};
          const differs=expand(inp.value)!==expand(def.default);
          row.dataset.differs=differs?'1':'0';
          if(differs)tags.append(Object.assign(el('button',{class:'ktag dot',title:'Engine default: '+(def.default===''?'(empty)':def.default)+' — click to reset'},'≠ default'),{onclick:()=>setVal(inp,def.default)}));
          if(def.ruleset)tags.append(Object.assign(el('button',{class:'ktag',title:'This directive may take its value from a ruleset (per sender/recipient)'},'ruleset…'),{onclick:()=>pickRuleset(inp)}));
        } else if(schema){
          tags.append(el('span',{class:'ktag warn',title:'The engine\'s ConfigDefs.pl does not list this directive: a typo, or one newer than the engine. MailScanner ignores unknown directives silently.'},'unknown'));
        }
        if(overrides[l.key])tags.append(el('span',{class:'ktag warn',title:'Set again in '+overrides[l.key]+', which the engine reads after this file — that value wins.'},'overridden in '+overrides[l.key].replace(/^conf\.d\//,'')));
      };
      inp.oninput=upd;inp.onchange=upd;upd();
      row.append(tags);
      rows.append(row);
    }
  });
  showChanged.querySelector('input').onchange=()=>rows.classList.toggle('onlydiff',showChanged.querySelector('input').checked);
  filter.oninput=()=>{
    const q=filter.value.toLowerCase();
    [...rows.children].forEach(r=>{
      if(!q){r.style.display='';return;}
      const inp=r.querySelector('[data-k]');
      r.style.display=(inp&&(inp.dataset.k.toLowerCase().includes(q)||inp.value.toLowerCase().includes(q)))?'':'none';
    });
  };
  root.append(el('div',{class:'ctl',style:'margin-bottom:.4rem'},filter,schema?showChanged:''),rows);
  return {root,body(){
    const changes={};rows.querySelectorAll('[data-k]').forEach(i=>{if(i.value!==ORIG[i.dataset.k])changes[i.dataset.k]=i.value;});
    return Object.keys(changes).length?{changes}:null;
  },describe(){const b=this.body();return b?Object.entries(b.changes).map(([k,v])=>`${k} = ${v}`).join('\n'):'';},
  focusKey(k){const i=rows.querySelector(`[data-k="${CSS.escape(k)}"]`);if(i){i.scrollIntoView({block:'center'});i.focus();i.classList.add('flash');setTimeout(()=>i.classList.remove('flash'),1500);}}};
}

// Table editor for the row-shaped files. Rows remember the line they came
// from so the server can keep comments in place; new rows carry no line.
const TABLE_SPECS={
  'rules':{cols:[{f:'direction',label:'Direction',type:'select',options:['To:','From:','FromOrTo:','FromAndTo:']},{f:'pattern',label:'Pattern',mono:true,ph:'*@domain.example'},{f:'and_direction',label:'and',type:'select',options:['','To:','From:','FromOrTo:','FromAndTo:']},{f:'and_pattern',label:'and-pattern',mono:true,ph:'(pattern)'},{f:'value',label:'Value',ph:'yes / no / deliver …'}],blank:{direction:'To:'},hint:'First match wins. Patterns are single tokens (*@domain, user@domain, default); the value is what the directive expects.'},
  'filename-rules':{cols:[{f:'action',label:'Action',type:'select',options:['allow','deny','deny+delete','rename'],free:true},{f:'pattern',label:'Pattern (perl regex)',mono:true,ph:'\\.exe$'},{f:'log_text',label:'Log text',ph:'Windows executable'},{f:'user_text',label:'Text shown to the user',ph:'Executables are not allowed'}],blank:{action:'deny'},hint:'Checked top to bottom; the first matching pattern decides. "rename" keeps the file with a safe name; "rename to .txt" also changes the extension.'},
  'spam-lists':{cols:[{f:'name',label:'Name',mono:true,ph:'SPAMHAUS-ZEN'},{f:'domain',label:'DNS zone',mono:true,ph:'zen.spamhaus.org.'}],blank:{},hint:'Names are what "Spam List" in MailScanner.conf refers to.'},
  'virus-scanners':{cols:[{f:'name',label:'Name',mono:true,ph:'clamd'},{f:'wrapper',label:'Wrapper',mono:true,ph:'/usr/lib/MailScanner/wrapper/clamav-wrapper'},{f:'dir',label:'Install dir',mono:true,ph:'/usr'}],blank:{},hint:'Names are what "Virus Scanners" in MailScanner.conf refers to.'},
  'host-list':{cols:[{f:'host',label:'Hostname',mono:true,ph:'phish.example'}],blank:{},hint:'One hostname per line; *.example covers subdomains. Paste several at once into a new row.'},
};
function tableEditor(d){
  const spec=TABLE_SPECS[d.kind];
  const root=el('div',{class:'tbl'});
  if(spec.hint)root.append(el('div',{class:'muted',style:'font-size:.8rem;margin-bottom:.4rem'},spec.hint));
  if(d.parsed&&d.parsed.normalized)root.append(el('div',{class:'note warn'},'Some lines use spaces where MailScanner expects tabs — saving rewrites them in the canonical form.'));
  const table=el('table');root.append(table);
  const ROWS=(d.parsed&&d.parsed.rows)||[];
  const UN=(d.parsed&&d.parsed.unparsed)||[];
  let dirty=false;
  function rowFor(r){
    const tr=el('tr',{class:'crow'});if(r.line)tr.dataset.line=r.line;
    spec.cols.forEach(c=>{
      let inp;
      const val=r[c.f]==null?'':String(r[c.f]);
      if(c.type==='select'&&!(c.free&&val&&!c.options.includes(val))){
        inp=el('select',{'data-f':c.f});
        c.options.forEach(o=>inp.append(el('option',{value:o,...(o===val?{selected:'selected'}:{})},o||'—')));
        if(c.free)inp.append(el('option',{value:'rename to .txt'},'rename to .txt'));
      } else {
        inp=el('input',{'data-f':c.f,value:val,placeholder:c.ph||''});
        if(c.mono)inp.classList.add('mono');
      }
      inp.oninput=()=>{dirty=true;};inp.onchange=()=>{dirty=true;};
      tr.append(el('td',{},inp));
    });
    tr.append(el('td',{},Object.assign(el('button',{class:'act plain',title:'Remove'},'✕'),{onclick:()=>{tr.remove();dirty=true;}})));
    return tr;
  }
  function draw(){
    table.innerHTML='';
    table.append(el('tr',{},...spec.cols.map(c=>el('th',{},c.label)),el('th',{})));
    ROWS.forEach(r=>table.append(rowFor(r)));
    UN.forEach(u=>table.append(el('tr',{class:'unparsed'},el('td',{colspan:String(spec.cols.length+1)},
      el('span',{class:'badge',style:'background:var(--critical);margin-right:.5rem'},'line '+u.line),
      el('span',{class:'mono muted'},u.text),
      el('span',{class:'muted',style:'margin-left:.5rem;font-size:.75rem'},'— not understood; kept as is (fix it in Raw mode)')))));
  }
  draw();
  const add=el('button',{class:'act plain'},'+ Add row');
  add.onclick=()=>{const tr=rowFor(spec.blank);table.append(tr);dirty=true;const f=tr.querySelector('input');if(f)f.focus();};
  root.append(el('div',{class:'ctl',style:'margin-top:.5rem'},add));
  // host lists: paste many hosts into one field → one row each
  if(d.kind==='host-list')table.addEventListener('paste',e=>{
    const t=(e.clipboardData||window.clipboardData).getData('text');
    const hosts=t.split(/[\s,;]+/).filter(Boolean);
    if(hosts.length<2)return;
